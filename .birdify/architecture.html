:root[data-theme="light"]{color-scheme:light;color:#202725;background:#fafbfa;--mint:#167552;--muted:#596a62;--line:#d8dfdb}
[data-theme="light"] .simulation{color:#89631e;border-color:#a87a27}
[data-theme="light"] .toggle{color:#34483c}
[data-theme="light"] .map-scroll{background-image:radial-gradient(#203f3020 1px,transparent 1px)}
[data-theme="light"] .node{background:#fff;color:#273c31;border-color:#a0afa6}
[data-theme="light"] .node .node-top svg,[data-theme="light"] .node .kind,[data-theme="light"] .node small{color:#50695b}
[data-theme="light"] .node.dim{opacity:.42}
[data-theme="light"] .node.scope{border-color:#937944;opacity:.8}
[data-theme="light"] .node.target{opacity:1;background:#e0f3e9;border-color:var(--mint);box-shadow:0 0 0 5px #16755209,0 0 30px #16755218}
[data-theme="light"] .node.target .kind,[data-theme="light"] .node.target .node-top svg{color:var(--mint)}
[data-theme="light"] .node.selected:after{background:#244c38}
[data-theme="light"] .node.verifying{background:#fff3d7;border-color:#9a7221;box-shadow:0 0 24px #9a722114}
[data-theme="light"] .node.completed{background:#e9f3ed;border-color:#3c8461;box-shadow:none}
[data-theme="light"] .edge{stroke:#7a8e81}
[data-theme="light"] .edge.relevant{stroke:#8b7444;opacity:.8}
[data-theme="light"] .legend .planned{border-color:#937944}
[data-theme="light"] p{color:#4d6356}
[data-theme="light"] li,[data-theme="light"] code{color:#355341}
[data-theme="light"] .unmapped,[data-theme="light"] #checks{color:#89631e}
[data-theme="light"] .step{border-color:#d8dfdb}
[data-theme="light"] .step.current{border-color:var(--mint)}
[data-theme="light"] .step.past{border-color:#8eaf9c}
[data-theme="light"] button:not(.node):not(.step){color:#385442}
[data-theme="light"] button.primary{color:#fff!important}
[data-theme="light"] select{background:#fff;color:#355341}

ectory-6","title":"viewer-runtime.md","kind":"group","role":"generic","label":"0 条规则 · reference","desc":"archify/references/viewer-runtime.md"}],"documents":{"project":{"body":"# Archify\n\n已整理 11 条规则，来自 7 份来源。本轮审查已提交的贡献、技能、评审、安全、创作契约、交付契约和 PR 模板中的核心义务。viewer/README.md、workflow 渲染器说明、brand-marks、viewer-runtime 和 archify-review 技能尚未逐条审查。工作区 CONTRIBUTING.md 相对该提交有未提交修改，规则锚点以提交快照为准。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。\n\n## 怎么阅读\n\n单击展开分类，选择规则阅读详情。编号区分主题；颜色与架构图一致，表示适用角色，不代表通过或失败。跨角色或未明确归属用通用色，混合分组也用通用色。实现核验尚未完成。\n\n## 本轮提炼来源\n\n- CONTRIBUTING.md\n- archify/SKILL.md\n- archify/references/authoring-contract.md\n- archify/references/delivery-contract.md\n- REVIEWING.md\n- SECURITY.md\n- .github/PULL_REQUEST_TEMPLATE.md\n\n## 覆盖边界\n\n来源扫描包含 12 份文件；0 条引用仍需核对。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30"},"category-interfaces":{"body":"# 接口与数据\n\n- **既有 schema v1 保持有效**：修改图表契约时\n- **不得发明字段**：编写 typed JSON 时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-security":{"body":"# 安全边界\n\n- **样本不得含秘密**：提交夹具、日志、截图、产物或包测试时\n- **漏洞私下报告**：发现疑似安全漏洞时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-testing":{"body":"# 测试与验证\n\n- **纯政策改动不做版面截图**：只改仓库政策文本时\n- **自动检查与观感分开写**：提交可见界面改动时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-delivery":{"body":"# 协作与交付\n\n- **已发布版本不可变**：普通功能改动时\n- **默认输出静态图**：生成图表时\n- **先写候选再看渲染器**：普通图表生成时\n- **非零退出不是成功**：交付 HTML 时\n- **失败保留上一份可信产物**：deliver 未通过时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"topic-security-secrets":{"body":"# 秘密与样本\n\n- **样本不得含秘密**：提交夹具、日志、截图、产物或包测试时"},"rule-no-secrets":{"body":"# 样本不得含秘密\n\n## 什么时候用\n\n提交夹具、日志、截图、产物或包测试时\n\n适用性：适用\n\n适用角色：安全。原文限制凭据和私有数据进入仓库材料。\n\n## 具体要求\n\n秘密、令牌、私有仓库内容和个人数据不能进入这些材料。\n\n## 怎么检查\n\n检查待提交内容是否包含凭据或私有数据。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`CONTRIBUTING.md:13-13`\n\n> Do not include secrets, access tokens, credentials, private repository content, personal data, or customer data in fixtures, logs, screenshots, artifacts, or package tests.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv3 · 2026-09-08T14:22:14+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- daced37a66ab21f1f8bb096daedd2c5337204020 · 2026-09-08T14:22:14+08:00\n- 95e8a3a9d50136bc34e1093edbca7d4a52e974aa · 2026-08-22T02:01:27+08:00\n- 733fb165d75c092c8d50b110e96656d84f0649de · 2026-07-26T09:55:03+08:00"},"topic-interfaces-compatibility":{"body":"# 契约兼容\n\n- **既有 schema v1 保持有效**：修改图表契约时"},"rule-schema-v1":{"body":"# 既有 schema v1 保持有效\n\n## 什么时候用\n\n修改图表契约时\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n已有 schema v1 文档继续有效，除非经过审查的变更明确给出破坏性规则和迁移路径。\n\n## 怎么检查\n\n用现有 v1 样例跑校验，并核对是否写明迁移。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`CONTRIBUTING.md:44-44`\n\n> - Existing schema-v1 typed JSON remains valid unless a reviewed change explicitly introduces a breaking rule and migration path.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv3 · 2026-09-08T14:22:14+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- daced37a66ab21f1f8bb096daedd2c5337204020 · 2026-09-08T14:22:14+08:00\n- 95e8a3a9d50136bc34e1093edbca7d4a52e974aa · 2026-08-22T02:01:27+08:00\n- 733fb165d75c092c8d50b110e96656d84f0649de · 2026-07-26T09:55:03+08:00"},"topic-delivery-versions":{"body":"# 版本不可变\n\n- **已发布版本不可变**：普通功能改动时"},"rule-immutable-versions":{"body":"# 已发布版本不可变\n\n## 什么时候用\n\n普通功能改动时\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n功能 PR 不改版本、标签或分发身份，除非本次范围明确包含发布。\n\n## 怎么检查\n\n核对 package 版本、标签和发布身份是否被无关改动。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`CONTRIBUTING.md:96-96`\n\n> Treat published versions as immutable. Ordinary feature PRs do not change versions, tags, or distribution identities unless release work is explicitly in scope.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv3 · 2026-09-08T14:22:14+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- daced37a66ab21f1f8bb096daedd2c5337204020 · 2026-09-08T14:22:14+08:00\n- 95e8a3a9d50136bc34e1093edbca7d4a52e974aa · 2026-08-22T02:01:27+08:00\n- 733fb165d75c092c8d50b110e96656d84f0649de · 2026-07-26T09:55:03+08:00"},"topic-delivery-authoring":{"body":"# 创作与交付\n\n- **默认输出静态图**：生成图表时\n- **先写候选再看渲染器**：普通图表生成时\n- **非零退出不是成功**：交付 HTML 时"},"rule-static-default":{"body":"# 默认输出静态图\n\n## 什么时候用\n\n生成图表时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n只有用户要求演示或展示时才打开运动。\n\n## 怎么检查\n\n检查候选是否在未要求时省略 animation。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`archify/SKILL.md:13-13`\n\n> Create a self-contained, interactive HTML diagram from a small typed JSON specification. Static output is the default; enable motion only when the user asks for a demo or presentation.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv4 · 2026-07-27T21:25:24+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- 3b5035f94760b28296408114b9780afa12ad128d · 2026-07-27T21:25:24+08:00\n- 8da892e860cbf0ea54e2709cf12829ae1dbb0dda · 2026-06-12T21:05:41+08:00\n- dcdc8d8fc9554ee72a06898db3a59a548aef9fdf · 2026-04-24T10:03:13+08:00\n- 1e9f223f8aa9f5113c74a609c3dd24f22019b810 · 2026-04-15T13:27:32+08:00"},"rule-artifact-first":{"body":"# 先写候选再看渲染器\n\n## 什么时候用\n\n普通图表生成时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n下一步应写出候选，不要先读渲染器内部或在正文里规划精确坐标。\n\n## 怎么检查\n\n核对创作顺序：候选文件先于渲染器阅读。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`archify/SKILL.md:21-21`\n\n> 3. Artifact first: the next tool action must write the candidate. Write the candidate before inspecting renderer internals. Do not plan exact coordinates in prose. Start with one clear main path, short side branches, sparse labels, and at most 12 primary nodes. Set `meta.quality_profile` to `\"showcase\"` unless the user explicitly requests a dense `standard` map. Start with automatic routes and labels. Do not add `via`, `channelX`, `channelY`, or `labelAt` before a diagnostic calls for one; apply at most one diagnosed geometry control per repair.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv6 · 2026-07-27T21:25:24+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- 3b5035f94760b28296408114b9780afa12ad128d · 2026-07-27T21:25:24+08:00\n- 55fe514b61b5227aee9f53dfa7ab39e1e9b4c74e · 2026-07-27T14:13:29+08:00\n- 7eef4db36a97d04da74a9cb1d1bc3f735058c074 · 2026-07-26T22:24:31+08:00\n- 2dce766ab19ff5871020828eb85d770745f1069d · 2026-07-26T19:04:31+08:00\n- 479147d5527468c45b817cd4e0fa42ec4817fedb · 2026-07-26T12:07:19+08:00\n- 181a432b981553bbf1082c194e2a01fd13ee6b7c · 2026-07-26T11:49:55+08:00"},"rule-nonzero-failure":{"body":"# 非零退出不是成功\n\n## 什么时候用\n\n交付 HTML 时\n\n适用性：适用\n\n适用角色：后端。原文约束 CLI 交付命令的成功判定。\n\n## 具体要求\n\ndeliver 非零退出不能说成成功。失败会保留上一份输出，不能对那条路径做 visual-check。\n\n## 怎么检查\n\n记录 deliver 退出码；失败时不要把旧产物当成新候选。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`archify/SKILL.md:35-35`\n\n>    A non-zero exit can never be described as success. A failed delivery preserves any previous output, so do not run `visual-check` on that path: it would inspect the stale last-good artifact, not the failed candidate. If validation fails, change only the diagnosed `subject`, verify `evidence`, choose from `supportedFixes`, and rerun. Continue focused correction while the objective error count reaches a new minimum. If two consecutive rounds do not improve that best count, stop and report the unresolved diagnostics truthfully.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv3 · 2026-08-30T12:36:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- 8b2aed2a6f0c623ac92a96108990d9e58348335f · 2026-08-30T12:36:57+08:00\n- 3b5035f94760b28296408114b9780afa12ad128d · 2026-07-27T21:25:24+08:00\n- 440e16d639ed94e55377fe66ef2350c171bdb971 · 2026-07-22T17:51:42+08:00"},"topic-interfaces-schema":{"body":"# 字段契约\n\n- **不得发明字段**：编写 typed JSON 时"},"rule-no-invented-fields":{"body":"# 不得发明字段\n\n## 什么时候用\n\n编写 typed JSON 时\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n用最近的样例确定结构，然后写新的 ID、措辞、事实和布局。\n\n## 怎么检查\n\n对照模式 schema 校验候选，确认没有未知字段。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`archify/references/authoring-contract.md:13-13`\n\n> Do not invent fields. Use the nearest matching example for structure, then author fresh IDs, wording, facts, and layout.\n\n来源文件最后修改：2026-09-16T13:44:01+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-07-27T21:25:24+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- 3b5035f94760b28296408114b9780afa12ad128d · 2026-07-27T21:25:24+08:00"},"topic-delivery-claims":{"body":"# 交付声明\n\n- **失败保留上一份可信产物**：deliver 未通过时"},"rule-preserve-artifact":{"body":"# 失败保留上一份可信产物\n\n## 什么时候用\n\ndeliver 未通过时\n\n适用性：适用\n\n适用角色：后端。原文约束交付命令失败时的产物处理。\n\n## 具体要求\n\n渲染、检查或回执失败时退出非零，并保留上一份可信产物，不打开文件。\n\n## 怎么检查\n\n让 deliver 失败，确认旧 HTML 仍在且没有被打开。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`archify/references/delivery-contract.md:19-19`\n\n> Deliver reads the specification once, writes those exact bytes to a private same-directory candidate snapshot, renders that snapshot, runs the complete artifact checker, and only replaces the target after all artifact checks pass. The JSON receipt includes SHA-256 and byte counts for both `specification` and `artifact`. Renderer, checker, receipt, or commit failure exits non-zero, removes private state, preserves the previous trusted artifact, and never invokes an opener.\n\n来源文件最后修改：2026-09-26T10:53:57-07:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-07-27T21:25:24+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- 3b5035f94760b28296408114b9780afa12ad128d · 2026-07-27T21:25:24+08:00"},"topic-testing-evidence":{"body":"# 审查证据\n\n- **纯政策改动不做版面截图**：只改仓库政策文本时"},"rule-policy-no-screenshots":{"body":"# 纯政策改动不做版面截图\n\n## 什么时候用\n\n只改仓库政策文本时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n这类改动做一致性检查，不要求布局截图。\n\n## 怎么检查\n\n按改动面核对文档与模板是否一致。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`REVIEWING.md:17-17`\n\n> Choose checks that resolve the important uncertainties, including relevant historical failures and authored constraints. Broaden the investigation when findings or coverage gaps warrant it. Repository-only policy changes need consistency checks, not layout screenshots.\n\n来源文件最后修改：2026-09-16T15:15:35+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-09-16T15:15:35+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- bc8cdc854c8046e281222a7018ab10fbe623d0d3 · 2026-09-16T15:15:35+08:00\n- daced37a66ab21f1f8bb096daedd2c5337204020 · 2026-09-08T14:22:14+08:00"},"topic-security-reporting":{"body":"# 漏洞报告\n\n- **漏洞私下报告**：发现疑似安全漏洞时"},"rule-private-report":{"body":"# 漏洞私下报告\n\n## 什么时候用\n\n发现疑似安全漏洞时\n\n适用性：适用\n\n适用角色：安全。原文要求漏洞在公开前私下报告。\n\n## 具体要求\n\n先私下报告，让维护者调查并协调修复，再公开披露。\n\n## 怎么检查\n\n确认报告走私下渠道，公开材料不含利用细节。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`SECURITY.md:3-5`\n\n> Archify welcomes responsible security reports. Please report suspected\n> vulnerabilities privately so maintainers can investigate and coordinate\n> remediation before public disclosure.\n\n来源文件最后修改：2026-08-30T14:09:55+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-08-30T14:09:55+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：c7f785014ad6f6c0d3723a1f3f5529f6c1b25e30\n\n- 4ac500a498267f18bda42b3c82b51edb8f9c1baf · 2026-08-30T14:09:55+08:00"},"topic-testing-visual":{"body":"# 视觉证据\n\n- **自动检查与观感分开写**：提交可见界面改动时"},"rule-separate-visual-claims":{"body":"# 自动检查与观感分开写\n\n## 什么时候用\n\n提交可见界面改动时\n\n适用性：按条件适用\n\n适用角色：前端。原文区分浏览器证据和人对界面的观感判断。\n\n## 具体要求\n\n浏览器或自动化结果与观感审查是两项声明，不能混写成一次通过。\n\n## 怎么检查\n\nPR 里分别填写自动化检查和观感审查。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`.github/PULL_REQUEST_TEMPLATE.md:25-25`\n\n> Report automated or browser evidence separately from perceptual review.\n\n来源文 ure cost of understanding, changing, and maintaining the code. Prefer existing capabilities and keep the solution proportional to the problem.\n> - **Impact**: Identify affected behavior and modules, consequences for users and future development, and whether the change improves maintainability or adds coupling and constraints.\n> \n> Consider maintainability, complexity, compatibility, performance, and other relevant concerns within these three dimensions, according to the specific problem.\n> \n> Ground judgments in evidence: verify the target revision and relevant facts, distinguish direct verification from existing evidence and assumptions, and choose checks that resolve the key uncertainties.\n> \n> Explain whether the work is worthwhile, the approach's cost and impact, any better alternatives, and unresolved questions that matter to the decision. Give reasons and scale the detail to the importance of each concern.\n> \n> For repository-specific review and contribution requirements, consult [REVIEWING.md](../../../REVIEWING.md) and [CONTRIBUTING.md](../../../CONTRIBUTING.md) as needed."},"directory-source-1":{"body":"# CONTRIBUTING.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n- 样本不得含秘密\n- 既有 schema v1 保持有效\n- 已发布版本不可变\n\n## 原文 / Source\n\n> # Contributing to Archify\n> \n> Archify is Agent-first: people describe systems, and the Skill, typed JSON, renderers, validators, and delivery receipts produce reproducible diagrams. Keep each contribution focused on one user-visible behavior or one tightly related delivery slice. Maintainers and Agents reviewing a PR or a revised head follow [Reviewing](REVIEWING.md).\n> \n> ## Choose the right path\n> \n> - Renderer, validator, package, or Viewer defect: use the [bug report form](.github/ISSUE_TEMPLATE/bug-report.yml).\n> - Reproducible real-world diagram: use the [showcase form](.github/ISSUE_TEMPLATE/showcase.yml).\n> - New schema fields, defaults, acceptance rules, installation/export contracts, or broad product behavior: agree on value, compatibility, and non-goals before substantial implementation. Link the issue or recorded maintainer decision; reuse an existing agreed scope.\n> - Narrow fixes and small documentation or test corrections can proceed with a concrete reproduction or rationale; a separate planning issue is unnecessary.\n> - Security vulnerabilities: follow [SECURITY.md](SECURITY.md).\n> \n> Do not include secrets, access tokens, credentials, private repository content, personal data, or customer data in fixtures, logs, screenshots, artifacts, or package tests.\n> \n> ## Prepare a reviewable change\n> \n> Start from the latest `main`. Check whether its existing controls already solve the reported case. Record the comparison base and candidate head.\n> \n> Use Draft for unresolved scope or early implementation feedback. At this stage, provide the smallest reproduction and relevant checks. Prepare broad integration evidence and generated artifacts once the approach is settled.\n> \n> Before requesting final review, explain:\n> \n> - The current-main trigger, intended outcome, and why the benefit justifies the implementation and ongoing maintenance cost.\n> - The changed behavior and shared callers, existing behavior that must remain stable, and any intended compatibility changes.\n> - The applicable checks, actual results, and reproducible evidence links.\n> \n> Use [the PR template](.github/PULL_REQUEST_TEMPLATE.md); link existing receipts or CI output instead of transcribing long logs. Classify impact by behavior and callers, not file extension or diff size.\n> \n> ## Choose evidence by impact\n> \n> | Impact | Typical change | Evidence to prepare |\n> | --- | --- | --- |\n> | Text or review policy | Explanatory prose, links, contributor/reviewer procedure | Check content, links, and consistency with affected templates or automation. No local renderer suite for repository-only prose. |\n> | Local behavior | One CLI path, focused test correction | Reproduction or rationale, affected tests, and relevant failure/compatibility cases. |\n> | Shared behavior | Geometry, text measurement, shared Viewer, evidence or delivery helpers | Trace callers; identify affected modes and contracts; compare fixed representative inputs on base and candidate, including relevant historical failures. |\n> | Contract change | Schema, defaults, validation acceptance, Skill or authoring instructions | Agreed scope and explicit allowed/preserved behavior, plus local/shared evidence appropriate to the implementation. |\n> \n> Skill instructions, authored examples, build inputs, and generated-site sources are behavioral inputs even when they look like documentation. Policy changes need process review; runtime evidence depends on whether they affect runtime inputs.\n> \n> Start with focused checks for the affected behavior. Use the full `npm test` suite from `archify/` when shared behavior, broad changes, or findings require wider coverage. Final review needs sufficient evidence for the impact above; relevant CI results can supply that coverage without repeating the same run locally. Identify the revision and coverage of reused results, and explain material gaps. Required remote CI and branch protection still apply.\n> \n> ## Product and compatibility contracts\n> \n> - Existing schema-v1 typed JSON remains valid unless a reviewed change explicitly introduces a breaking rule and migration path.\n> - Preserve authored topology and intent; explicit geometry remains authoritative unless the contract says otherwise. Consult the [authoring contract](archify/references/authoring-contract.md) and relevant renderer documentation for details.\n> - `standard` preserves broad compatibility. A new `showcase` failure must identify a real, repairable defect and avoid rejecting necessary routing.\n> - Agent-facing failures belong in `diagnostics[]`: use a stable `code`, precise `subject`, concrete `evidence`, and executable `supportedFixes`. Preserve non-zero CLI exits and machine-readable receipts for failed stages.\n> - A validation rule expressing taste should begin with evidence or a warning. Before making it a hard error, check legitimate obstacles, shared ports, explicit routes, nested boundaries, and existing examples.\n> - Keep one canonical contract per behavior. Link the existing source instead of copying CLI stages, receipt fields, or error tables.\n> \n> ## Local setup and verification\n> \n> The renderer package is the repository root `package.json`. Skill sources stay in `archify/`.\n> \n> ```sh\n> npm ci\n> npm test\n> ```\n> \n> Test through public behavior such as `render`, `validate`, `deliver`, `visual-check`, or final SVG/HTML. Behavioral fixes should include a regression that demonstrates the original failure. Private helper checks can supplement that evidence.\n> \n> For geometry and layout changes, use the smallest redacted JSON reproduction, relevant checked-in examples, and frozen compatibility fixtures. Compare base and candidate with the same input and browser conditions. Identify intended changes and investigate unexpected ones; updating golden files alone does not establish visual or compatibility acceptance.\n> \n> A visual PR must provide enough evidence to evaluate whether the intended user value was achieved, using screenshots, recordings, or reproducible steps. Keep viewport, theme, preset, diagram mode, zoom, and page state comparable. Report automated or browser evidence separately from perceptual review. Non-visual changes may omit the Visual evidence section.\n> \n> Static SVG/XML checks cannot establish browser layout, font settling, or interaction behavior. When the adaptive reader or Viewer layout changes, run the real browser test with Chrome available:\n> \n> ```sh\n> ARCHIFY_CHROME=\"/path/to/chrome\" node --test test/desktop-reader-browser.test.mjs\n> ```\n> \n> A browser test skipped because Chrome was unavailable is **skipped**, not passed. Follow [the delivery contract](archify/references/delivery-contract.md) for visual evidence, receipts, and failure stages. Successful validation, atomic delivery, browser checks, and perceptual review establish different claims.\n> \n> ## Packages and generated artifacts\n> \n> Viewer maintenance starts in [`viewer/`](viewer/README.md). Edit its source\n> files, then run `npm run generate:viewer` from the repository root; the delivered template\n> is generated and its freshness is checked by `npm test`.\n> \n> Published artifacts must be reproducible from tracked content. Use a tracked-only, symlink-safe staging path or explicit allowlist, with negative coverage for untracked files and external symlinks. Test the extracted package outside the repository on the affected advertised hosts.\n> \n> Review source and focused tests before regenerating artifacts. Regenerate only outputs whose authoritative inputs changed, from the final combined source:\n> \n> ```sh\n> node scripts/build-gallery.mjs docs\n> node scripts/build-guide.mjs docs/guide.html\n> node scripts/build-start.mjs docs/start.html\n> node scripts/build-readme-showcase.mjs\n> scripts/build-zip.sh /tmp/archify-contrib.zip\n> ```\n> \n> Canonical ZIP bytes require Node 22; the builder rejects other majors to avoid different zlib representations. Skill runtime, schema, renderer, and published Skill-instruction changes require checking ZIP freshness. Bundled example or Viewer changes normally require a Gallery rebuild.\n> \n> List regenerated files and explain freshness when an affected output is left unchanged. Changes that do not affect generated outputs may omit that PR section. Resolve generated conflicts by rebuilding from combined source. Keep unrelated generated output out of the diff.\n> \n> Treat published versions as immutable. Ordinary feature PRs do not change versions, tags, or distribution identities unless release work is explicitly in scope.\n> \n> ## Final integration and follow-up\n> \n> Refresh `main` and the PR head before final integration; account for relevant base changes and resolve conflicts. Rerun local checks whose evidence was invalidated. Unchanged evidence may be linked with its original revision and reuse rationale; do not relabel it as a new-head run. Verify that required remote CI actually ran on the final head and obey branch protection; zero checks is not green.\n> \n> On revision, summarize what changed since the reviewed head and which findings it addresses. This lets reviewers focus on the new diff and outstanding decisions.\n> \n> Showcase submissions should include the prompt, agent/client, model, Archify version, redacted JSON, artifact, receipts, and truthful visual-review status. Maintainers may request a smaller safe reproduction. Preserve attribution; showcase acceptance is not a controlled model-quality benchmark.\n> \n> ## Automated review\n> \n> CodeRabbit provides advisory feedback under the repository [configuration](.coderabbit.yaml). Answer with relevant evidence or explain why a finding does not apply. Missing evidence is an unresolved claim, not proof of a code defect. Maintainers settle disputed scope; required CI and the maintainer's merge decision remain separate.\n> \n> For retriggering or pausing reviews, use the official [review commands](https://docs.coderabbit.ai/reference/review-commands) and check the updated results. Bot assessments are snapshots at the stated revision; refresh stale checks after description or CI updates and read the latest evidence before repeating a request. Fork-CI approval requires a maintainer to inspect the proposed workflow/code changes; authors can link the waiting run.\n> \n> ## License\n> \n> By contributing, you agree to the repository's [MIT License](LICENSE). Submit only work you created or have the right to contribute."},"directory-4":{"body":"# archify\n\n## 本目录来源 / Local sources\n\n- archify/SKILL.md · 3 条已整理规则\n  默认输出静态图：生成图表时（conditional）\n  先写候选再看渲染器：普通图表生成时（conditional）\n  非零退出不是成功：交付 HTML 时（applicable）\n\n## 上级指令来源 / Ancestor instructions\n\n- CONTRIBUTING.md · 3 条已整理规则\n  样本不得含秘密：提交夹具、日志、截图、产物或包测试时（applicable）\n  既有 schema v1 保持有效：修改图表契约时（applicable）\n  已发布版本不可变：普通功能改动时（applicable）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 11 条规则，来自 7 份来源。本轮审查已提交的贡献、技能、评审、安全、创作契约、交付契约和 PR 模板中的核心义务。viewer/README.md、workflow 渲染器说明、brand-marks、viewer-runtime 和 archify-review 技能尚未逐条审查。工作区 CONTRIBUTING.md 相对该提交有未提交修改，规则锚点以提交快照为准。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-2":{"body":"# archify/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 默认输出静态图\n- 先写候选再看渲染器\n- 非零退出不是成功\n\n## 原文 / Source\n\n> ---\n> name: archify\n> description: Create polished, validated architecture, workflow, sequence, data-flow, and lifecycle/state diagrams as explorable standalone HTML with inline SVG, dark/light themes, optional trace motion, and PNG/JPEG/WebP/SVG/WebM export. Accept plain-language requirements or pasted Mermaid flowchart, sequenceDiagram, and stateDiagram input; inspect repository evidence when the diagram must reflect real code. Use when the user asks to visualize system architecture, infrastructure, cloud/security/network topology, technical workflows, API call sequences, request lifecycles, data pipelines, ETL/ELT, data lineage, state machines, or to convert/beautify Mermaid.\n> license: MIT\n> metadata:\n>   version: \"2.17\"\n>   author: tt-a1i\n>   based_on: Cocoon-AI/architecture-diagram-generator (MIT, v1.0)\n> ---\n> \n> # Archify\n> \n> Create a self-contained, interactive HTML diagram from a small typed JSON specification. Static output is the default; enable motion only when the user asks for a demo or presentation.\n> \n> ## Fast authoring path\n> \n> Use this bounded path for ordinary generation. Do not read the optional Viewer Runtime reference unless the user asks about those features.\n> \n> 1. Choose `architecture`, `workflow`, `sequence`, `dataflow`, or `lifecycle` from the question.\n> 2. Read one matching schema in `schemas/`, `schemas/common.schema.json`, and one matching JSON example in `examples/`. Read only those files. Fresh authorship means new stable IDs, domain wording, and layout; use the example for field shape, not facts. New workflow sources use `schema_version: 2` and its readable layout contract; keep `schema_version: 1` only when preserving an existing workflow's fixed geometry. When real product identity matters, query `node scripts/archify.mjs brands \"\u003cname>\" --json`; read `references/brand-marks.md` only for an unknown brand with a user-provided URL.\n> 3. Artifact first: the next tool action must write the candidate. Write the candidate before inspecting renderer internals. Do not plan exact coordinates in prose. Start with one clear main path, short side branches, sparse labels, and at most 12 primary nodes. Set `meta.quality_profile` to `\"showcase\"` unless the user explicitly requests a dense `standard` map. Start with automatic routes and labels. Do not add `via`, `channelX`, `channelY`, or `labelAt` before a diagnostic calls for one; apply at most one diagnosed geometry control per repair.\n> 4. Validate after every candidate edit and immediately before handoff:\n> \n>    ```bash\n>    node scripts/archify.mjs validate \u003ctype> \u003ccandidate.json> --quality showcase --json\n>    ```\n> \n>    A receipt with only 4 artifact checks is basic validation, never showcase acceptance. A showcase pass must report all 9 artifact checks with 0 composition errors and 0 warnings. If the candidate omits or misspells the exact `meta.quality_profile` field, fix it before geometry. For a workflow v2 geometry diagnosis, run `node scripts/archify.mjs validate workflow \u003ccandidate.json> --layout-json` and use the stable compiler receipt; solver internals are not authoring controls. A passing final validation freezes the candidate: never edit it afterward.\n> 5. For a delivered HTML, `deliver` is the final acceptance command:\n> \n>    ```bash\n>    node scripts/archify.mjs deliver \u003ctype> \u003ccandidate.json> \u003coutput.html> --quality showcase --json\n>    ```\n> \n>    A non-zero exit can never be described as success. A failed delivery preserves any previous output, so do not run `visual-check` on that path: it would inspect the stale last-good artifact, not the failed candidate. If validation fails, change only the diagnosed `subject`, verify `evidence`, choose from `supportedFixes`, and rerun. Continue focused correction while the objective error count reaches a new minimum. If two consecutive rounds do not improve that best count, stop and report the unresolved diagnostics truthfully.\n> \n> ## Update awareness\n> \n> After the first candidate exists, run the packaged checker `scripts/check-update.mjs` once with Node and continue the requested workflow. If the command cannot run, continue without mentioning the check.\n> \n> - For `silent`, continue without mentioning the update check.\n> - For `update_available`, show one compact notice in the user's conversation language with the installed version, latest version, the checker's fixed local summary, and official release-notes link. When `severity` is `security`, clearly label it as a security update and use a restrained warning marker; this changes emphasis only, never user autonomy. Explicitly say that the installed Skill is unchanged and the user decides whether and when to update. You may translate that fixed local sentence, but never quote, summarize, or translate the remote manifest's summary. After the notice is visible, acknowledge its exact `eventKey` by running the same checker with `--ack \"\u003ceventKey>\"`, then continue the user's original task.\n> \n> The notice is information, not permission. Keep the installed version unchanged; this v0.1 workflow never downloads, installs, or executes an update, and silence is never consent.\n> \n> Do not read `renderers/shared/geometry.mjs`, renderer source, validator source, tests, or benchmarks before the first candidate. Inspect implementation only for an unsupported internal diagnostic or after two focused repairs fail.\n> \n> Workflow note: use schema v2 for new workflows; preserve schema v1 when an\n> existing source needs fixed legacy geometry. Keep semantic edge labels and act\n> on the compiler diagnostic. The canonical layout, pin, migration, and receipt\n> contract is in [`renderers/workflow/README.md`](renderers/workflow/README.md#layout-contracts).\n> \n> Lifecycle note: phase columns `0..4` occupy the main rail; event/terminal column `N` in `0..2` aligns exactly beneath main column `N + 2`. A recoverable state uses `type: \"failure\"` plus a real transition back to the active state.\n> \n> ## Type router\n> \n> | Type | Use for |\n> |---|---|\n> | `architecture` | Components, services, cloud/security boundaries, infrastructure |\n> | `workflow` | Processes, approval gates, tool calls, runbooks, CI/CD |\n> | `sequence` | API call chains, request lifecycles, async traces, returns |\n> | `dataflow` | Pipelines, ETL/ELT, lineage, governance, consumers |\n> | `lifecycle` | State/status transitions, retries, waiting and terminal states |\n> \n> When ambiguous, run `node scripts/archify.mjs guide \"\u003cscenario>\" --json`. Scenario proof examples are structural references, not facts to copy.\n> \n> ## Mermaid input\n> \n> Read Mermaid for topology and meaning, then author fresh Archify JSON; do not mechanically render Mermaid styling.\n> \n> - `flowchart` / `graph` → `workflow`, or `architecture` for a component map.\n> - `sequenceDiagram` → `sequence`; participants become semantic participants and arrows become messages.\n> - `stateDiagram` → `lifecycle`; states and transitions retain meaning, not Mermaid style.\n> \n> ## Authoring invariants\n> \n> - One obvious main path; side branches leave the nearest main-path node. Remove low-value edges before adding routing controls.\n> - Omit `meta.visual_preset` by default so every diagram opens in `classic`, regardless of whether its resolved color mode is light or dark. Color mode and visual preset are independent: switching Light / Dark must preserve the current preset. Set `signal-flow`, `blueprint`, or `editorial` only when the user explicitly requests that visual style.\n> - Omit `meta.subtitle` by default. Never invent a subtitle that restates the title, nodes, or cards; include one short supporting line only when the user explicitly asks for it.\n> - Treat the standalone desktop viewer as a first-screen artifact by default, not a shallow strip. Generate one responsive artifact for laptops and external displays—never device-specific HTML or alternate topology. The viewer may adapt only the outer reading width from the live viewport height; it must preserve the authored SVG/viewBox, proportions, semantic geometry, and normal document flow. On a wide or tall desktop, use enough authored vertical rhythm that the diagram panel and its necessary conclusion cards occupy the screen as a balanced whole; runtime scaling cannot repair an over-compressed Y layout or an undersized explicit `meta.viewBox`. Before handoff, open the real HTML at 1440×900, 1600×1000, and 1920×1080; additionally check 2048×1320 whenever the composition is intended for a large desktop display. Require `document.documentElement.scrollWidth \u003c= window.innerWidth` and `scrollHeight \u003c= window.innerHeight` at every checked size, while visually checking that the diagram remains comfortably readable and vertically balanced at the largest checked viewport. Repair overflow by removing only genuinely redundant content or compacting spacing before shrinking nodes, labels, or the main panel. If the largest viewport still has a conspicuous empty lower band at the viewer's width cap, redistribute authored Y positions and increase the viewBox height proportionally; do not add filler copy or decorative cards. Never counterfeit a pass with `overflow: hidden`, clipped content, an internal diagram scroller, stretched SVG height, or smaller typography. Narrow/mobile layouts may scroll vertically when containment requires it.\n> - Omit `meta.legend` for the truthful `auto` default. When needed, use only `mode: auto|all|hidden` and renderer-supported `entries.\u003ckind>.label|visible`; labels never change semantics.\n> - Choose one primary authored language from an explicit user choice; otherwise follow the request or conversation's dominant language. `meta.locale` controls only renderer-owned Viewer UI: use `\"en\"` or `\"zh-CN\"` for the corresponding supported primary language. For every other language, omit `meta.locale` and explicitly disclose that the fixed Viewer UI and `\u003chtml lang>` fall back to English. The renderer never translates authored content. See `references/authoring-contract.md` for details.\n> - Preserve exact product names, code identifiers, commands, protocols, API paths, and environment names. They may remain English inside localized copy, but never justify leaving the surrounding explanatory prose in another language.\n> - Brand identity is optional and explicit. Put a canonical built-in ID in `brand` when the node names that real product. If no preset matches and the user supplied the official HTTP(S) URL, first run `node scripts/archify.mjs brands capture \"\u003curl>\" --json`, then author the returned digest-pinned `brand` object. Render and validate never perform an unpinned capture. Otherwise omit `brand`. Never infer a brand from a vague role such as \"database\", and never let a badge replace the semantic `type`, label, or relationship facts.\n> - For sequence diagrams, omit `meta.column_fit` for the stable `fixed` layout. Set it to `\"spread\"` when a wide viewBox would otherwise leave unused horizontal space or when meaningful participant labels do not fit the fixed boxes; do not shorten semantic labels before trying `spread`.\n> - Component types are `frontend`, `backend`, `database`, `cloud`, `security`, `messagebus`, and `external`; variants are `default`, `emphasis`, `security`, and `dashed`.\n> - Relationship labels are semantic data. When one collides, move the label, adjust the route or spacing, then shorten the wording while preserving meaning. Omit only wording that is already fully implied by both endpoints and contains no protocol, action, direction, synchronous/asynchronous behavior, or cross-boundary mechanism. Preserve every meaningful label; deleting it is not a geometry repair. If a relationship starts unlabeled because its endpoints fully imply it, explain why the wording is redundant; this is a semantic authoring choice, not a geometry repair.\n> - Omit `meta.engineering_profile` by default. Region, cluster, and security boundary wording do not by themselves enable it. Enable `deployment-ownership` only when the user explicitly asks for a production deployment topology, ownership handoff, or fail-closed deployment review and the source facts are known. Once enabled, must not remove the engineering profile merely to pass validation; repair the facts or report the diagnostics truthfully.\n> - Spacing means clear gap, not center distance. For a relationship label, clear gap must exceed its measured mask width; follow the label-preserving repair order.\n> - Automatic routes own their endpoint sides. A side is a direction contract: the first and final segment must leave/enter perpendicular to that side.\n> - Automatic Port Spread is a default renderer behavior for architecture, workflow, data-flow, and lifecycle. It skips single relationships and explicit `via`, `channelX`, `channelY`, `labelAt`, or non-`auto` routes. Near parallel ports use an outside bridge so automatic routing cannot create a sub-8px segment or sub-16px interior turn. Architecture separately keeps unobstructed facing automatic ports (`left`/`right` or `top`/`bottom`) on one shared axis when their offset is under 16px and both ports retain corner clearance. If exactly one endpoint was spread, only the unshared endpoint may move onto that axis; if both endpoints were spread, keep the outside bridge so competing ports remain distinct.\n> - Never accept an edge crossing an unrelated opaque node, an ambiguous shared corridor, or a relationship label masking another route.\n> \n> Read `references/authoring-contract.md` only when you need field enums, spacing math, geometry repair rules, repository evidence, or mode-specific placement.\n> \n> ## Delivery\n> \n> Use `validate` during repair and `deliver` once for final acceptance. Delivery freezes the exact specification bytes into a private same-directory snapshot, renders and checks that snapshot, atomically commits the HTML, and reports SHA-256 plus byte counts for both specification and artifact. This is deterministic artifact evidence; it does not exercise the Viewer in a browser.\n> \n> After delivery, collect bounded desktop evidence without modifying or rerendering the trusted HTML:\n> \n> ```bash\n> node scripts/archify.mjs visual-check \u003coutput.html> --json\n> ```\n> \n> `visual-check` collects automated browser evidence from the exact delivered HTML without modifying or rerendering it. Its machine-readable measurements and screenshots do not approve perceptual polish. Follow `references/delivery-contract.md` for the canonical receipt fields, coverage, sidecars, exit behavior, and supplementary manual-record requirements.\n> \n> Keep the three claims separate: `deliver` proves deterministic artifact checks, `visual-check` proves bounded behavior in a real browser, and perceptual visual review requires an actual human or image-capable reviewer. Report browser evidence and perceptual review independently. An unconstrained glance can support only perceptual review; use the canonical delivery contract when recording supplementary manual browser work or handling an environmental failure.\n> \n> Add `--open` only when the user wants an immediate local preview. For an active desktop authoring loop, the optional command is:\n> \n> ```bash\n> node scripts/archify.mjs preview \u003ctype> \u003cinput>.json \u003coutput>.html --quality showcase\n> ```\n> \n> Never start preview by default. Read `references/delivery-contract.md` when using preview, repository evidence, export receipts, visual review, or post-commit opening.\n> \n> ## Optional viewer capabilities\n> \n> Generated HTML already contains theme switching, pan/zoom, search, focus, relationship tracing, semantic views, presentation, and truthful exports. These are reader capabilities, not extra authoring work. `meta.animation: \"trace\"` is opt-in; `meta.views` is optional and should contain at most five curated chapters.\n> \n> Read `references/viewer-runtime.md` only when the user explicitly asks for Share Cards, Route/Reach cards, motion, guided stories, deep links, presentation, search/focus, or another Viewer Runtime feature.\n> \n> ## Setup and fallback\n> \n> No install is required inside the skill package. Verify with:\n> \n> ```bash\n> node scripts/archify.mjs doctor\n> node scripts/archify.mjs demo \u003coutput-directory>\n> ```\n> \n> When shell access is unavailable, hand-place architecture SVG into `assets/template.html`, use CSS semantic classes rather than inline colors, and follow the visual review contract in `references/delivery-contract.md`.\n> \n> ## Output\n> \n> Return the checked HTML path, diagram type, validation summary, specification/artifact receipt, browser-evidence status, and truthful visual-review status. Do not claim success for a non-zero command or claim visual inspection you did not perform."},"directory-source-3":{"body":"# REVIEWING.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 纯政策改动不做版面截图\n\n## 原文 / Source\n\n> # Reviewing Archify changes\n> \n> Use this guide for initial and revised PR reviews. Judge the user value, implementation and ongoing maintenance cost, and impact on existing behavior. [Contributing](CONTRIBUTING.md#choose-evidence-by-impact) describes contribution and evidence requirements.\n> \n> ## Understand the problem and approach\n> \n> Record the current main/base and candidate head. Read the linked issue or agreed scope and check the current-main behavior where feasible. Separate the reported problem from the proposed implementation.\n> \n> Identify who benefits and whether the approach is worth maintaining. Consider whether existing capabilities or a smaller change would solve the problem. For a new default, schema field, or acceptance policy, clarify the value and compatibility tradeoff early. Reuse decisions already made in the issue or authorized task.\n> \n> If a decision is missing, explain how it affects the review and continue checks that do not depend on it. Narrow fixes can proceed on their reproduction without another planning exercise.\n> \n> ## Match investigation to impact\n> \n> Check the author's [impact classification](CONTRIBUTING.md#choose-evidence-by-impact) against the changed paths and callers. Shared helpers, templates, and authoring instructions may affect more modes than the title suggests.\n> \n> Choose checks that resolve the important uncertainties, including relevant historical failures and authored constraints. Broaden the investigation when findings or coverage gaps warrant it. Repository-only policy changes need consistency checks, not layout screenshots.\n> \n> Use existing tests, receipts, and browser tools. For behavior comparisons, use fixed inputs on the recorded base and candidate:\n> \n> - Account for changed and preserved topology, meaningful labels, explicit geometry, and relevant failure behavior.\n> - For affected visible behavior, inspect the intended differences and unexplained changes under comparable browser conditions. A pixel difference identifies a change; it does not judge its quality.\n> - When a fix also changes a validator or golden baseline, evaluate that acceptance change explicitly. Fresh generated output proves consistency with the candidate, not compatibility with the base.\n> - Separate locally reproduced results, author/CI evidence, reused evidence, and unknowns. Keep browser checks and perceptual review distinct.\n> \n> Evidence should be sufficient for the affected contract. Avoid rebuilding an unchanged artifact or replaying unaffected checks merely to restate existing results.\n> \n> ## Give actionable feedback\n> \n> Lead with whether the approach is worthwhile, then explain findings and a clear disposition:\n> \n> - **Blocking defect:** trigger, impact, supporting evidence, and the behavior that must be corrected.\n> - **Required evidence or scope decision:** the unresolved claim, why it matters to acceptance, and the smallest check or decision that would settle it. An unverified risk is not a reproduced defect.\n> - **Suggestion:** a worthwhile improvement outside the acceptance conditions; personal preference alone does not block.\n> - **Ready:** the agreed behavior is delivered, relevant evidence is sufficient, and no acceptance blocker remains.\n> \n> Consolidate scope and compatibility concerns in the first substantive review where possible. Explain any later blocker with newly found evidence, an overlooked acceptance requirement, or a new diff. Record unrelated issues separately instead of growing the PR's scope.\n> \n> Assess bot findings against the current diff and existing evidence before forwarding them. Explain duplicate or inapplicable findings; use the same standard of evidence as for your own feedback.\n> \n> ## Re-review and finish\n> \n> Compare against the last reviewed head, resolve outstanding findings, and inspect added changes. Check intervening main changes for effects on the earlier assessment. Expand review when those changes invalidate scope or evidence; do not treat an old pass as proof of new behavior.\n> \n> Finish when the agreed outcome is delivered, relevant evidence is sufficient, and no acceptance blockers remain. Report non-blocking limitations. A review conclusion does not itself authorize a GitHub approval or merge; follow the authorized action and [final integration requirements](CONTRIBUTING.md#final-integration-and-follow-up)."},"directory-source-4":{"body":"# SECURITY.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 漏洞私下报告\n\n## 原文 / Source\n\n> # Security Policy\n> \n> Archify welcomes responsible security reports. Please report suspected\n> vulnerabilities privately so maintainers can investigate and coordinate\n> remediation before public disclosure.\n> \n> ## Supported versions\n> \n> Archify is under active development. Please report vulnerabilities affecting\n> the latest stable release or current `main`.\n> \n> Reports affecting older releases are also welcome. Include the exact version\n> or commit so maintainers can determine the affected range. This policy does\n> not promise maintenance or backports for older releases.\n> \n> ## Reporting a vulnerability\n> \n> Use GitHub's private vulnerability reporting for this repository when that\n> option is available.\n> \n> Include, when available:\n> \n> - the affected Archify version or commit;\n> - the installation method, operating system, Node.js version, and relevant\n>   host or agent;\n> - the affected command, component, or entry point;\n> - a minimal reproduction or proof of concept;\n> - the security impact and conditions required to reproduce it;\n> - a suggested mitigation or workaround, if known.\n> \n> Use a minimal, redacted reproduction. Do not publish exploit details,\n> credentials, access tokens, secrets, private repository content, personal\n> data, or customer data in public issues, discussions, pull requests, logs,\n> screenshots, generated artifacts, or package tests.\n> \n> If private vulnerability reporting is unavailable, open a public issue asking\n> the maintainers for a private security contact. Do not include vulnerability\n> details in that issue.\n> \n> ## Coordinated disclosure\n> \n> Please keep vulnerability details private while the report is being triaged\n> and, when applicable, while a fix is being prepared.\n> \n> Coordinate public disclosure with the maintainers through the private reporting\n> channel so affected users can be given accurate remediation guidance.\n> \n> ## Non-security bugs\n> \n> Use [the bug report form](.github/ISSUE_TEMPLATE/bug-report.yml) for\n> functional, rendering, validation, compatibility, packaging, or documentation\n> defects that do not create a security impact.\n> \n> If you are unsure whether a finding is security-sensitive, report it privately."},"directory-5":{"body":"# .github\n\n## 本目录来源 / Local sources\n\n- .github/PULL_REQUEST_TEMPLATE.md · 1 条已整理规则\n  自动检查与观感分开写：提交可见界面改动时（conditional）\n\n## 上级指令来源 / Ancestor instructions\n\n- CONTRIBUTING.md · 3 条已整理规则\n  样本不得含秘密：提交夹具、日志、截图、产物或包测试时（applicable）\n  既有 schema v1 保持有效：修改图表契约时（applicable）\n  已发布版本不可变：普通功能改动时（applicable）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 11 条规则，来自 7 份来源。本轮审查已提交的贡献、技能、评审、安全、创作契约、交付契约和 PR 模板中的核心义务。viewer/README.md、workflow 渲染器说明、brand-marks、viewer-runtime 和 archify-review 技能尚未逐条审查。工作区 CONTRIBUTING.md 相对该提交有未提交修改，规则锚点以提交快照为准。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-5":{"body":"# .github/PULL_REQUEST_TEMPLATE.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 自动检查与观感分开写\n\n## 原文 / Source\n\n> \u003c!-- Authors: follow CONTRIBUTING.md. Reviewers and Agents: follow REVIEWING.md. -->\n> \n> ## Problem and value\n> \n> Current-main trigger or rationale, intended outcome, why the approach is worth maintaining, and linked issue/agreed scope:\n> \n> ## Stability impact\n> \n> - Impact class and changed behavior/shared callers: \u003c!-- CONTRIBUTING.md#choose-evidence-by-impact -->\n> - Existing behavior preserved / intended compatibility changes / failure behavior:\n> \n> ## Tests run\n> \n> Comparison base and candidate head; applicable commands/results or evidence links. Identify reused evidence by its original revision and explain material coverage gaps. Follow CONTRIBUTING.md#choose-evidence-by-impact; required remote CI still applies.\n> \n> ## Visual evidence\n> \n> Omit this section for non-visual changes.\n> \n> - Evidence provided: \u003c!-- screenshots, recordings, or reproducible steps; intended and unexpected differences -->\n> - Comparison conditions: \u003c!-- same input, viewport, theme, preset, mode, zoom, page state -->\n> - Automated or browser checks:\n> - Perceptual visual review: passed / failed / skipped / Not applicable\n> \n> Report automated or browser evidence separately from perceptual review.\n> \n> ## Generated artifacts\n> \n> Omit this section if generated outputs are unaffected. Otherwise list regenerated files or linked build evidence, and explain freshness of affected outputs left unchanged."},"directory-6":{"body":"# archify/references\n\n## 本目录来源 / Local sources\n\n- archify/references/authoring-contract.md · 1 条已整理规则\n  不得发明字段：编写 typed JSON 时（applicable）\n- archify/references/delivery-contract.md · 1 条已整理规则\n  失败保留上一份可信产物：deliver 未通过时（applicable）\n- archify/references/brand-marks.md · 0 条已整理规则\n\n- archify/references/viewer-runtime.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- CONTRIBUTING.md · 3 条已整理规则\n  样本不得含秘密：提交夹具、日志、截图、产物或包测试时（applicable）\n  既有 schema v1 保持有效：修改图表契约时（applicable）\n  已发布版本不可变：普通功能改动时（applicable）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 11 条规则，来自 7 份来源。本轮审查已提交的贡献、技能、评审、安全、创作契约、交付契约和 PR 模板中的核心义务。viewer/README.md、workflow 渲染器说明、brand-marks、viewer-runtime 和 archify-review 技能尚未逐条审查。工作区 CONTRIBUTING.md 相对该提交有未提交修改，规则锚点以提交快照为准。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-6":{"body":"# archify/references/authoring-contract.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 不得发明字段\n\n## 原文 / Source\n\n> # Authoring contract\n> \n> Read this reference only after the Fast authoring path calls for more detail. The schemas and examples remain authoritative.\n> \n> ## Schema lookup\n> \n> Read both the mode schema and `schemas/common.schema.json`. The mode schemas use `$ref`, so the common file is where shared enums live.\n> \n> - `componentType`: `frontend`, `backend`, `database`, `cloud`, `security`, `messagebus`, `external`\n> - `variant`: `default`, `emphasis`, `security`, `dashed`\n> - Relationship IDs use the shared identifier pattern and must be unique in their collection.\n> \n> Do not invent fields. Use the nearest matching example for structure, then author fresh IDs, wording, facts, and layout.\n> \n> ## Workflow layout contracts\n> \n> Use schema v2 for new workflows and keep schema v1 when an existing source must\n> retain fixed geometry. In both versions, `col` stays in `0..5` and semantic\n> edge labels are never deleted as a spacing repair. Do not change only\n> `schema_version` when absolute coordinates exist: follow the canonical\n> [migration and layout-receipt contract](../renderers/workflow/README.md#migration-and-layout-receipt).\n> The complete normative invariants live in the workflow renderer's\n> [layout contracts](../renderers/workflow/README.md#layout-contracts).\n> \n> ## Legend contract\n> \n> Omit `meta.legend` for the truthful default: `auto` lists only semantic kinds\n> present in typed IR. Use `mode: \"all\"` for a renderer reference or\n> `mode: \"hidden\"` to remove the full legend. Under `entries`, only keys listed\n> by the selected mode schema are valid; each key accepts `label`, `visible`, or\n> both. `visible: true` may show an unused supported convention, while\n> `visible: false` hides it. `hidden` cannot be overridden.\n> \n> A label override changes reader wording only. Never infer a kind from prose or\n> use the legend to compensate for missing nodes, states, messages, or flows.\n> Long labels are measured and wrap into deterministic rows. Architecture's\n> implicit automatic viewBox grows from that same measured footprint. For\n> backwards compatibility, a legacy document with no `meta.legend` may omit an\n> implicit auto legend that cannot fit its explicit viewBox; this never changes\n> its typed topology. Adding `meta.legend` makes the presentation intentional and\n> strict: if its resolved labels cannot fit the authored viewBox, shorten or hide\n> them, or widen the viewBox using the emitted diagnostic.\n> \n> ## Language consistency\n> \n> Choose one primary authored language. An explicit user choice wins; otherwise\n> use the language of the request, or the conversation's dominant language when\n> the request itself is language-neutral. Separately choose the Viewer locale.\n> For supported languages, always write the matching `meta.locale`: `\"en\"` for\n> English or `\"zh-CN\"` for Simplified Chinese. The renderer consumes the authored\n> locale without inferring language from diagram strings. Documents that omit it\n> remain valid and default to English.\n> \n> `meta.locale` controls only renderer-owned reader surfaces: `\u003chtml lang>`, the\n> document-title suffix, default SVG description and focus labels, default legend\n> labels, and fixed Viewer controls, statuses, accessibility names, and errors.\n> It never translates authored content. Apply the primary language separately to\n> titles, subtitles, node and relationship copy, boundaries, lanes, groups,\n> guided views, legend label overrides, and cards. A bilingual diagram still\n> chooses one primary locale for the Viewer; follow an explicit primary-language\n> request, then prompt order or conversation dominance.\n> \n> For a requested language outside `en` and `zh-CN`, do not write an unsupported\n> locale. Keep every reader-facing authored string in the requested language,\n> omit `meta.locale` so the renderer safely uses English, and explicitly tell the\n> user that fixed Viewer UI and `\u003chtml lang>` remain English and the artifact is\n> not fully localized. The fallback applies only to renderer-owned surfaces; it\n> never permits authored copy to fall back to English. Do not silently substitute\n> `zh-CN` for another language or Chinese locale.\n> \n> Keep exact product names, code identifiers, commands, protocols, API paths, and\n> environment names intact. Those terms may remain English inside localized copy,\n> but surrounding explanatory prose must still use the selected language.\n> Renderer-owned default legend labels follow `meta.locale`; author a\n> `meta.legend.entries.*.label` override only when the diagram needs different\n> domain wording, and keep that authored override in the primary language.\n> \n> ## Visual preset default\n> \n> Omit `meta.visual_preset` by default. The renderer then opens the diagram in\n> `classic` for both light and dark color modes. Color mode and visual preset are\n> independent viewer state: switching Light / Dark must preserve the current\n> preset. Author `signal-flow`, `blueprint`, or `editorial` only when the user\n> explicitly requests that visual style.\n> \n> ## Engineering profile default\n> \n> Omit `meta.engineering_profile` for an ordinary system architecture. Region,\n> cluster, and security boundary wording do not by themselves enable an\n> engineering profile. Enable `deployment-ownership` only when the user\n> explicitly asks for a production deployment topology, ownership handoff, or\n> fail-closed deployment review and the source facts are known. Once enabled,\n> do not remove the engineering profile merely to pass validation; repair the\n> authored facts or report the diagnostics truthfully.\n> \n> ## Title hierarchy\n> \n> Use one concise title and let the diagram carry the explanation. Omit\n> `meta.subtitle` by default, and never use it to restate the title, nodes, edges,\n> or cards. Include one short supporting line only when the user explicitly asks\n> for a subtitle; an omitted or blank subtitle must not leave an empty visual row\n> in the generated viewer.\n> \n> ## Executable geometry rules\n> \n> - Node anchors start at side midpoints. `left`/`right` change the horizontal endpoint; `top`/`bottom` change the vertical endpoint. For an automatic Architecture relationship, unobstructed facing ports whose axis offset is under 16px may share one horizontal or vertical axis when both endpoints retain the 16px corner gutter. If exactly one endpoint belongs to a spread group, only its unshared counterpart moves; relationships spread at both endpoints keep their distinct ports and outside bridge.\n> - A side is a direction contract. The first and final route segment must be perpendicular and outward/inward in the named direction.\n> - Automatic Port Spread is a default renderer behavior for architecture, workflow, data-flow, and lifecycle diagrams. Shared automatic endpoints spread deterministically and symmetrically with a 16px corner gutter. It does not apply to sequence messages, single relationships, or explicit `via`, `channelX`, `channelY`, `labelAt`, or non-`auto` routes.\n> - Showcase route rhythm: every nonzero segment must be at least 8px; every interior segment must be at least 16px. When spread ports are nearly parallel, the router uses a 24px endpoint stub and a 16px outside bridge instead of manufacturing a tiny dogleg.\n> - Shared endpoint corridors are allowed only when they remain semantically unambiguous. Unrelated collinear overlap of 8px or more fails showcase.\n> - Container borders are intentional pass-through geometry, but a long edge running along a structural border is not.\n> - An edge crossing an unrelated opaque node is always a hard failure, independent of quality profile.\n> \n> ### Spacing and labels\n> \n> Spacing recommendations mean clear gap between boxes, not center distance. A 200px center distance between 165px-wide nodes leaves only 35px of clear gap.\n> \n> For a relationship label, require:\n> \n> ```text\n> clear gap > label mask width + 8px breathing room\n> label mask width ≈ 6.5px × ASCII units + 13px\n> CJK characters count as two units\n> ```\n> \n> Relationship labels are semantic data. If the gap is too small, move the label,\n> adjust the route or spacing, then shorten the wording while preserving meaning.\n> Omit only wording already fully implied by both endpoints and carrying no\n> protocol, action, direction, synchronous/asynchronous behavior, or\n> cross-boundary mechanism. Preserve every meaningful label.\n> Deleting it is not a spacing repair. If a relationship starts unlabeled because\n> its endpoints fully imply it, explain why the wording is redundant; this is a\n> semantic authoring choice, not a spacing repair. In workflow v2, let the compiler\n> allocate its measured mask before applying a diagnosed `labelAt`,\n> `labelDx`/`labelDy`, or `labelSegment`. Apply one diagnosed geometry control at\n> a time.\n> \n> ### Repair order\n> \n> 1. Fix missing/invalid `meta.quality_profile` and schema errors.\n> 2. Fix node overlap or out-of-range placement.\n> 3. Fix edge-through-node and endpoint-direction errors.\n> 4. Fix crossings, ambiguous corridors, border runs, and route rhythm.\n> 5. Fix label-to-node, label-to-label, then label-to-route clearance.\n> \n> Run `validate` after every edit. Consume `diagnostics[]` by stable `code`, exact `subject`, measured `evidence`, and `supportedFixes`. If the diagnostic gives `labelAt`, use that point instead of estimating another offset.\n> \n> ## Mode placement\n> \n> ### Architecture\n> \n> Use one left-to-right spine with short vertical branches. Prefer 6–12 primary components and group only real ownership, trust, process, or deployment boundaries. Boundaries do not replace relationships.\n> \n> Grid placement is preferred when the schema supports it. Free positions are appropriate for a bounded exception, not for prose-level coordinate planning. Keep external actors outside the system boundary when that is factually true.\n> \n> ### Workflow\n> \n> Lanes express responsibility or phase. Columns `0..5` express logical\n> progression. Start new workflows on `readable-v2`; retain `fixed-v1` only for\n> legacy geometry compatibility. Keep the happy path monotonic, preserve semantic\n> edge labels, and route retries and exception returns outside the main lane\n> corridor.\n> \n> ### Sequence\n> \n> Participants are ordered by conversation role. Messages own their vertical order. Use return/async/security variants for meaning, not decoration; sequence does not use Automatic Port Spread.\n> \n> ### Dataflow\n> \n> Stages express transformation or custody. Rows separate parallel streams. Label only data contracts, classifications, or cross-boundary movement that is not obvious.\n> \n> ### Lifecycle\n> \n> Main phases use columns `0..4`; event and terminal bands use columns `0..2`.\n> Event/terminal column `N` aligns to the same x coordinate as main column\n> `N + 2`. A recoverable failure needs a real transition back to an active state.\n> A card or guided view saying “retry” is not topology.\n> \n> ## Repository evidence\n> \n> When an architecture diagram must reflect real code, inspect repository\n> entrypoints, runtime boundaries, storage, transports, and deployment\n> configuration before authoring. Record only evidence you actually verified.\n> `--repo-root \u003cpath>` is architecture-only and is accepted by architecture\n> `render`, `validate`, `deliver`, `preview`, and `compare`; workflow, sequence,\n> dataflow, and lifecycle reject it. Never infer runtime causality from file\n> proximity or naming alone.\n> \n> Declare `meta.repository.url` and one full 40-character `revision`, then attach\n> `components[].sources` with repository-relative `path`, optional `line`,\n> `end_line`, and `label`. Verification reads blobs at that commit, independently\n> of working-tree edits. Verification ignores local Git replacement refs, including\n> those selected by `GIT_REPLACE_REF_BASE`, and always reads the original objects\n> at the pinned SHA. It does not change repository configuration or delete\n> replacement refs.\n> A matching local origin, available commit, bounded path,\n> blob, and valid line range are required in every link mode. Verification is\n> local and makes no remote requests; it establishes neither public availability\n> nor the current reader's access rights.\n> \n> `link_mode` defaults to `web`. GitHub and Gitee HTTPS repository URLs generate\n> revision-pinned links; their public hosts select the provider automatically.\n> Optional `provider: \"github\"` or `\"gitee\"` must agree with the host. Existing\n> GitHub declarations and default delivery receipt fields remain compatible.\n> \n> ```json\n> {\n>   \"url\": \"https://gitee.com/team/service\",\n>   \"revision\": \"0123456789abcdef0123456789abcdef01234567\",\n>   \"provider\": \"gitee\"\n> }\n> ```\n> \n> For an internal or unsupported forge, select `link_mode: \"local-only\"`. The\n> Viewer retains SRC markers, searchable file paths, line ranges, and revision\n> labels without repository or source hyperlinks. The evidence receipt adds\n> `linkMode: \"local-only\"`. `url` remains required as the expected origin identity;\n> local-only disables links, not identity verification. A repository without an\n> origin is not supported.\n> \n> ```json\n> {\n>   \"url\": \"http://git.internal:3000/Platform/Services/service\",\n>   \"revision\": \"0123456789abcdef0123456789abcdef01234567\",\n>   \"link_mode\": \"local-only\"\n> }\n> ```\n> \n> Local-only accepts HTTP(S), `git@host:path`, and `ssh://git@host[:port]/path`\n> addresses, including nested namespaces. Declare a credential-free address;\n> HTTP(S) credentials on the checkout's origin are ignored for identity and\n> redacted from diagnostics. Hostnames compare case-insensitively; repository\n> paths retain case except for the existing GitHub behavior. A trailing slash\n> normalizes away. Only GitHub and Gitee normalize a terminal `.git` and match\n> standard HTTPS/443 with Git SSH/22. For other hosts, use the actual clone address:\n> transport, port, `.git` suffix, and remote-relative versus absolute paths must\n> match. For example, `git@host:Team/repo` differs from\n> `ssh://git@host/Team/repo`; `git@host:/Team/repo` matches the latter. SCP-style\n> paths preserve literal percent escapes, while URI paths decode them. SSH host\n> aliases and forge-specific browse/clone prefixes are not guessed.\n> GitLab/Gitea/Forgejo/Bitbucket web links are not implemented in this version;\n> use local-only until a tested link provider is available. Unknown web providers\n> fail with a diagnostic rather than emitting a guessed link.\n> \n> ## Hand-placed fallback\n> \n> Use only when no renderer can run. Start from `assets/template.html`, keep semantic CSS classes, preserve the inline SVG/accessibility structure, and run the delivery visual checklist. Never introduce inline literal colors that break dark/light parity."},"directory-source-7":{"body":"# archify/references/delivery-contract.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 失败保留上一份可信产物\n\n## 原文 / Source\n\n> # Delivery contract\n> \n> ## Validate and deliver\n> \n> Use `validate` after every candidate edit. CLI HTML output paths must end in `.html`, including after symbolic-link resolution.\n> Compare receipt paths must end in `.json`. Explicit CLI paths may be absolute or\n> outside the current working directory; authored `meta.output` remains confined\n> to that directory. A type mismatch fails before writing with\n> `output/cli-extension` or `output/cli-resolved-extension`. These checks prevent\n> accidental file-type overwrites; they do not sandbox explicit CLI directories\n> or prevent replacement of an existing artifact of the expected type.\n> \n> Use final atomic delivery only after the candidate is frozen:\n> \n> ```bash\n> node scripts/archify.mjs deliver \u003ctype> \u003ccandidate.json> \u003coutput.html> --quality showcase --json\n> ```\n> \n> Deliver reads the specification once, writes those exact bytes to a private same-directory candidate snapshot, renders that snapshot, runs the complete artifact checker, and only replaces the target after all artifact checks pass. The JSON receipt includes SHA-256 and byte counts for both `specification` and `artifact`. Renderer, checker, receipt, or commit failure exits non-zero, removes private state, preserves the previous trusted artifact, and never invokes an opener.\n> \n> Run `visual-check` only after `deliver` exits zero for the current candidate. If\n> delivery fails and the output path already exists, that path still names the\n> previous trusted artifact; running `visual-check` then would measure and capture\n> stale output, not the rejected candidate. Report the delivery diagnostics and\n> repair the source before collecting new visual evidence.\n> \n> The delivery interface exposes three separate claims:\n> \n> 1. `deliver` proves deterministic artifact checks and byte identity.\n> 2. `visual-check` collects automated browser evidence from the exact artifact.\n> 3. Perceptual visual review records a human or image-capable reviewer's judgment.\n> \n> Passing one claim never implies either of the others. Never claim that the deterministic receipt includes visual review. It does not include browser evidence either.\n> \n> ## Recovering a failed comparison\n> \n> `compare` commits an HTML artifact and its JSON receipt as a pair. If that commit\n> fails, it attempts to restore the previous files. A complete rollback removes\n> the temporary directory as usual.\n> \n> If a previous file cannot be restored, compare exits non-zero with\n> `delta/commit-rollback-failed` and retains the recovery directory. In the JSON\n> failure receipt, `diagnostics[].evidence.recoveryDirectory` identifies that\n> directory and `recoveryFiles` lists `{ backup, target }` paths for the files whose\n> restoration failed. Human-readable diagnostics also print the recovery paths.\n> \n> Resolve the filesystem error, inspect the current targets, and restore each\n> listed backup to its corresponding target before retrying. Keep the recovery\n> directory until both previous files have been recovered and verified; it can\n> also contain rejected candidate files, which must not be mistaken for backups.\n> Successful comparisons and failures before commit retain their normal cleanup.\n> \n> ## Automated browser evidence\n> \n> After delivery, inspect the exact trusted HTML without rerendering or modifying\n> it:\n> \n> ```bash\n> node scripts/archify.mjs visual-check \u003coutput.html> --json\n> ```\n> \n> The zero-dependency command uses Chrome/Chromium through the DevTools pipe. It\n> measures light-theme containment at 1440×900, 1600×1000, 1920×1080, and\n> 2048×1320, then captures light/dark screenshots at 1440×900 and 2048×1320. It\n> writes four PNG sidecars, one relative-path HTML contact sheet, and one JSON\n> receipt beside the artifact. The receipt binds the source artifact SHA-256 and\n> byte count, identifies `evidenceKind: \"automated-browser\"`, records READ plus\n> Still runtime state, and always reports `visualReview: \"pending\"`; automated\n> browser evidence cannot claim perceptual review.\n> \n> `browser_evidence` in the handoff records only the outcome of this automated command:\n> \n> - `passed` maps from exit 0 and receipt `status: \"pass\"` only after every required measurement and capture completes and passes.\n> - `failed` maps from exit 1 and receipt `status: \"fail\"` when the inspection finds a defect, the command fails, or a runtime/capture error leaves the evidence incomplete.\n> - `skipped` maps only from exit 2 and receipt `status: \"skipped\"` when Chrome/Chromium is unavailable and the inspection does not run.\n> \n> Runtime or capture failures leave incomplete evidence and must not be normalized to `skipped`. Failed or skipped capture runs remove stale\n> image/contact-sheet sidecars rather than presenting prior evidence as current.\n> They do not invalidate an already successful deterministic delivery, and they\n> do not turn a perceptual visual review into passed or failed. Retry an\n> environmental failure through the supported command in a browser-capable\n> execution context when practical. Keep the packaged transport unchanged unless\n> the failure reproduces through that seam in a capable environment.\n> \n> ## Optional opening\n> \n> Add `--open` only when the user wants an immediate local preview. It runs after that atomic commit, uses one argument-array OS opener with a five-second bound, and records `open.status`. Keep it off for CI, unattended agents, and non-interactive environments. Failure or unsupported opening does not invalidate delivery; its status proves only whether the local opener invocation succeeded.\n> \n> ## Last-Good Live Preview\n> \n> For an active desktop authoring loop only:\n> \n> ```bash\n> node scripts/archify.mjs preview \u003ctype> \u003cinput>.json \u003coutput>.html --quality showcase\n> ```\n> \n> Preview watches one explicit input on loopback, binds each stable digest to a private snapshot, and advances only after the existing verified delivery pipeline passes. Invalid, half-written, deleted, or superseded input leaves the previous verified revision on screen and on disk. Identical bytes do not rebuild or reload.\n> \n> The preview runtime ships inside the zero-dependency Skill ZIP and must work without `node_modules`.\n> \n> Never start it by default. Do not use it for CI, unattended agents, remote sharing, or mobile use. `--no-open` is only for a user who will open the printed local URL or for loop testing. Stop it with Ctrl-C before handoff. Server state, port, source path, diagnostics, error text, and reload tokens must never enter the generated artifact or any export.\n> \n> ## Perceptual delivery gate\n> \n> Automated validation and browser evidence cannot prove visual polish. After deterministic delivery, inspect the actual HTML in a capable browser or render the evidence screenshots with an image reader. Check both themes when changed, the default READ view, line crossings/corridors, label masks, node/card fit, focus/search/passport closure, and export cleanliness.\n> \n> For the default standalone desktop viewer, measure 1440×900, 1600×1000, and 1920×1080. When the artifact is intended for a large desktop display, also measure 2048×1320. A first-screen pass requires `document.documentElement.scrollWidth \u003c= window.innerWidth` and `scrollHeight \u003c= window.innerHeight` at every checked size. At the largest checked viewport, inspect the rendered composition for a conspicuous empty lower band: the main panel and necessary conclusion cards should use the available height as a balanced whole, not collapse into a shallow strip. If a desktop viewport overflows, repair the authored composition by removing only genuinely redundant content or compacting spacing before shrinking nodes, labels, or the main panel. Do not hide overflow, clip content, introduce an internal diagram scroller, or reduce node/label typography to make the measurement pass. Narrow/mobile containment may retain vertical page scrolling.\n> \n> A manual browser record is supplementary to the automated status. Reproducing the same coverage requires all four exact viewport measurements, both endpoint themes, and an artifact-bound record of the inspected SHA-256 and byte count. It never changes `browser_evidence`: when Chrome/Chromium is unavailable, that status remains `skipped` even when the manual browser record is complete and `visual_review: passed`; an automated `failed` result likewise remains `failed`. An unconstrained browser glance can support perceptual review only.\n> \n> Report exactly one truthful status:\n> \n> - `visual_review: passed` — only after inspecting the rendered artifact.\n> - `visual_review: skipped (image reader unavailable)` — when no capable visual surface exists.\n> - `visual_review: failed` — with the concrete visible defect.\n> \n> Use `correction_rounds: 0`, `correction_rounds: 1`, or `correction_rounds: 2`; never exceed a maximum of two focused correction rounds. Never report `visual_review: passed` without inspecting the artifact.\n> \n> If visual review changes the candidate, validation and delivery must run again because the prior frozen specification receipt is no longer current.\n> \n> ## Handoff receipt\n> \n> Return:\n> \n> ```text\n> diagram_type: architecture|workflow|sequence|dataflow|lifecycle\n> output: /absolute/path/to/file.html\n> specification_sha256: \u003creceipt value>\n> artifact_sha256: \u003creceipt value>\n> validation: 9/9 showcase, 0 errors, 0 warnings\n> browser_evidence: passed|failed|skipped\n> visual_review: passed|skipped (image reader unavailable)|failed\n> correction_rounds: 0|1|2\n> ```\n> \n> Derive `browser_evidence` only from the latest artifact-bound `visual-check` receipt. Record any manual browser work separately with its artifact binding, viewport/theme scope, and observations; never use it or `visual_review` to overwrite the automated status.\n> \n> Opening, preview status, Share Cards, and other viewer exports are not validation claims."},"directory-7":{"body":"# viewer\n\n## 本目录来源 / Local sources\n\n- viewer/README.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- CONTRIBUTING.md · 3 条已整理规则\n  样本不得含秘密：提交夹具、日志、截图、产物或包测试时（applicable）\n  既有 schema v1 保持有效：修改图表契约时（applicable）\n  已发布版本不可变：普通功能改动时（applicable）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 11 条规则，来自 7 份来源。本轮审查已提交的贡献、技能、评审、安全、创作契约、交付契约和 PR 模板中的核心义务。viewer/README.md、workflow 渲染器说明、brand-marks、viewer-runtime 和 archify-review 技能尚未逐条审查。工作区 CONTRIBUTING.md 相对该提交有未提交修改，规则锚点以提交快照为准。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-sour
