tted files, external references, implicit contracts and host/user instructions need separate inspection.\n- Sections are source material, not automatically effective or verified rules.\n- History counts use current file paths; rename ancestry is not followed."},"instruction":{"body":"# 目录指令\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"skill":{"body":"# 任务技能\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"reference":{"body":"# 引用规范\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:.agents":{"body":"# .agents\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:.agents/skills":{"body":"# .agents/skills\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:.agents/skills/archify-review":{"body":"# .agents/skills/archify-review\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-8ab041abcd1194db":{"body":"# .agents/skills/archify-review/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: archify-review\ndescription: Review Archify issues, PRs, or code through value, cost, and impact to support evidence-based maintenance decisions. Use for issue triage, change reviews, and code quality assessments.\n---\n\n# Archify Review\n\nJudge whether a problem is worth addressing and an approach is worth maintaining over time.\n\n- **Value**: Identify the real problem, who benefits, how often it occurs, its consequences, and whether it is worth addressing now.\n- **Cost**: Consider implementation and verification effort, along with the future cost of understanding, changing, and maintaining the code. Prefer existing capabilities and keep the solution proportional to the problem.\n- **Impact**: Identify affected behavior and modules, consequences for users and future development, and whether the change improves maintainability or adds coupling and constraints.\n\nConsider maintainability, complexity, compatibility, performance, and other relevant concerns within these three dimensions, according to the specific problem.\n\nGround judgments in evidence: verify the target revision and relevant facts, distinguish direct verification from existing evidence and assumptions, and choose checks that resolve the key uncertainties.\n\nExplain whether the work is worthwhile, the approach's cost and impact, any better alternatives, and unresolved questions that matter to the decision. Give reasons and scale the detail to the importance of each concern.\n\nFor repository-specific review and contribution requirements, consult [REVIEWING.md](../../../REVIEWING.md) and [CONTRIBUTING.md](../../../CONTRIBUTING.md) as needed."},"source-8ab041abcd1194db-s1":{"body":"来源：`.agents/skills/archify-review/SKILL.md:6-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Archify Review\n\nJudge whether a problem is worth addressing and an approach is worth maintaining over time.\n\n- **Value**: Identify the real problem, who benefits, how often it occurs, its consequences, and whether it is worth addressing now.\n- **Cost**: Consider implementation and verification effort, along with the future cost of understanding, changing, and maintaining the code. Prefer existing capabilities and keep the solution proportional to the problem.\n- **Impact**: Identify affected behavior and modules, consequences for users and future development, and whether the change improves maintainability or adds coupling and constraints.\n\nConsider maintainability, complexity, compatibility, performance, and other relevant concerns within these three dimensions, according to the specific problem.\n\nGround judgments in evidence: verify the target revision and relevant facts, distinguish direct verification from existing evidence and assumptions, and choose checks that resolve the key uncertainties.\n\nExplain whether the work is worthwhile, the approach's cost and impact, any better alternatives, and unresolved questions that matter to the decision. Give reasons and scale the detail to the importance of each concern.\n\nFor repository-specific review and contribution requirements, consult [REVIEWING.md](../../../REVIEWING.md) and [CONTRIBUTING.md](../../../CONTRIBUTING.md) as needed."},"source-eca12c0a30e25b4b":{"body":"# CONTRIBUTING.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Contributing to Archify\n\nArchify is Agent-first: people describe systems, and the Skill, typed JSON, renderers, validators, and delivery receipts produce reproducible diagrams. Keep each contribution focused on one user-visible behavior or one tightly related delivery slice. Maintainers and Agents reviewing a PR or a revised head follow [Reviewing](REVIEWING.md).\n\n## Choose the right path\n\n- Renderer, validator, package, or Viewer defect: use the [bug report form](.github/ISSUE_TEMPLATE/bug-report.yml).\n- Reproducible real-world diagram: use the [showcase form](.github/ISSUE_TEMPLATE/showcase.yml).\n- New schema fields, defaults, acceptance rules, installation/export contracts, or broad product behavior: agree on value, compatibility, and non-goals before substantial implementation. Link the issue or recorded maintainer decision; reuse an existing agreed scope.\n- Narrow fixes and small documentation or test corrections can proceed with a concrete reproduction or rationale; a separate planning issue is unnecessary.\n- Security vulnerabilities: follow [SECURITY.md](SECURITY.md).\n\nDo not include secrets, access tokens, credentials, private repository content, personal data, or customer data in fixtures, logs, screenshots, artifacts, or package tests.\n\n## Prepare a reviewable change\n\nStart from the latest `main`. Check whether its existing controls already solve the reported case. Record the comparison base and candidate head.\n\nUse Draft for unresolved scope or early implementation feedback. At this stage, provide the smallest reproduction and relevant checks. Prepare broad integration evidence and generated artifacts once the approach is settled.\n\nBefore requesting final review, explain:\n\n- The current-main trigger, intended outcome, and why the benefit justifies the implementation and ongoing maintenance cost.\n- The changed behavior and shared callers, existing behavior that must remain stable, and any intended compatibility changes.\n- The applicable checks, actual results, and reproducible evidence links.\n\nUse [the PR template](.github/PULL_REQUEST_TEMPLATE.md); link existing receipts or CI output instead of transcribing long logs. Classify impact by behavior and callers, not file extension or diff size.\n\n## Choose evidence by impact\n\n| Impact | Typical change | Evidence to prepare |\n| --- | --- | --- |\n| Text or review policy | Explanatory prose, links, contributor/reviewer procedure | Check content, links, and consistency with affected templates or automation. No local renderer suite for repository-only prose. |\n| Local behavior | One CLI path, focused test correction | Reproduction or rationale, affected tests, and relevant failure/compatibility cases. |\n| Shared behavior | Geometry, text measurement, shared Viewer, evidence or delivery helpers | Trace callers; identify affected modes and contracts; compare fixed representative inputs on base and candidate, including relevant historical failures. |\n| Contract change | Schema, defaults, validation acceptance, Skill or authoring instructions | Agreed scope and explicit allowed/preserved behavior, plus local/shared evidence appropriate to the implementation. |\n\nSkill instructions, authored examples, build inputs, and generated-site sources are behavioral inputs even when they look like documentation. Policy changes need process review; runtime evidence depends on whether they affect runtime inputs.\n\nStart with focused checks for the affected behavior. Use the full `npm test` suite from `archify/` when shared behavior, broad changes, or findings require wider coverage. Final review needs sufficient evidence for the impact above; relevant CI results can supply that coverage without repeating the same run locally. Identify the revision and coverage of reused results, and explain material gaps. Required remote CI and branch protection still apply.\n\n## Product and compatibility contracts\n\n- Existing schema-v1 typed JSON remains valid unless a reviewed change explicitly introduces a breaking rule and migration path.\n- Preserve authored topology and intent; explicit geometry remains authoritative unless the contract says otherwise. Consult the [authoring contract](archify/references/authoring-contract.md) and relevant renderer documentation for details.\n- `standard` preserves broad compatibility. A new `showcase` failure must identify a real, repairable defect and avoid rejecting necessary routing.\n- Agent-facing failures belong in `diagnostics[]`: use a stable `code`, precise `subject`, concrete `evidence`, and executable `supportedFixes`. Preserve non-zero CLI exits and machine-readable receipts for failed stages.\n- A validation rule expressing taste should begin with evidence or a warning. Before making it a hard error, check legitimate obstacles, shared ports, explicit routes, nested boundaries, and existing examples.\n- Keep one canonical contract per behavior. Link the existing source instead of copying CLI stages, receipt fields, or error tables.\n\n## Local setup and verification\n\nThe renderer package is the repository root `package.json`. Skill sources stay in `archify/`.\n\n```sh\nnpm ci\nnpm test\n```\n\nTest through public behavior such as `render`, `validate`, `deliver`, `visual-check`, or final SVG/HTML. Behavioral fixes should include a regression that demonstrates the original failure. Private helper checks can supplement that evidence.\n\nFor geometry and layout changes, use the smallest redacted JSON reproduction, relevant checked-in examples, and frozen compatibility fixtures. Compare base and candidate with the same input and browser conditions. Identify intended changes and investigate unexpected ones; updating golden files alone does not establish visual or compatibility acceptance.\n\nA visual PR must provide enough evidence to evaluate whether the intended user value was achieved, using screenshots, recordings, or reproducible steps. Keep viewport, theme, preset, diagram mode, zoom, and page state comparable. Report automated or browser evidence separately from perceptual review. Non-visual changes may omit the Visual evidence section.\n\nStatic SVG/XML checks cannot establish browser layout, font settling, or interaction behavior. When the adaptive reader or Viewer layout changes, run the real browser test with Chrome available:\n\n```sh\nARCHIFY_CHROME=\"/path/to/chrome\" node --test test/desktop-reader-browser.test.mjs\n```\n\nA browser test skipped because Chrome was unavailable is **skipped**, not passed. Follow [the delivery contract](archify/references/delivery-contract.md) for visual evidence, receipts, and failure stages. Successful validation, atomic delivery, browser checks, and perceptual review establish different claims.\n\n## Packages and generated artifacts\n\nViewer maintenance starts in [`viewer/`](viewer/README.md). Edit its source\nfiles, then run `npm run generate:viewer` from the repository root; the delivered template\nis generated and its freshness is checked by `npm test`.\n\nPublished artifacts must be reproducible from tracked content. Use a tracked-only, symlink-safe staging path or explicit allowlist, with negative coverage for untracked files and external symlinks. Test the extracted package outside the repository on the affected advertised hosts.\n\nReview source and focused tests before regenerating artifacts. Regenerate only outputs whose authoritative inputs changed, from the final combined source:\n\n```sh\nnode scripts/build-gallery.mjs docs\nnode scripts/build-guide.mjs docs/guide.html\nnode scripts/build-start.mjs docs/start.html\nnode scripts/build-readme-showcase.mjs\nscripts/build-zip.sh /tmp/archify-contrib.zip\n```\n\nCanonical ZIP bytes require Node 22; the builder rejects other majors to avoid different zlib representations. Skill runtime, schema, renderer, and published Skill-instruction changes require checking ZIP freshness. Bundled example or Viewer changes normally require a Gallery rebuild.\n\nList regenerated files and explain freshness when an affected output is left unchanged. Changes that do not affect generated outputs may omit that PR section. Resolve generated conflicts by rebuilding from combined source. Keep unrelated generated output out of the diff.\n\nTreat published versions as immutable. Ordinary feature PRs do not change versions, tags, or distribution identities unless release work is explicitly in scope.\n\n## Final integration and follow-up\n\nRefresh `main` and the PR head before final integration; account for relevant base changes and resolve conflicts. Rerun local checks whose evidence was invalidated. Unchanged evidence may be linked with its original revision and reuse rationale; do not relabel it as a new-head run. Verify that required remote CI actually ran on the final head and obey branch protection; zero checks is not green.\n\nOn revision, summarize what changed since the reviewed head and which findings it addresses. This lets reviewers focus on the new diff and outstanding decisions.\n\nShowcase submissions should include the prompt, agent/client, model, Archify version, redacted JSON, artifact, receipts, and truthful visual-review status. Maintainers may request a smaller safe reproduction. Preserve attribution; showcase acceptance is not a controlled model-quality benchmark.\n\n## Automated review\n\nCodeRabbit provides advisory feedback under the repository [configuration](.coderabbit.yaml). Answer with relevant evidence or explain why a finding does not apply. Missing evidence is an unresolved claim, not proof of a code defect. Maintainers settle disputed scope; required CI and the maintainer's merge decision remain separate.\n\nFor retriggering or pausing reviews, use the official [review commands](https://docs.coderabbit.ai/reference/review-commands) and check the updated results. Bot assessments are snapshots at the stated revision; refresh stale checks after description or CI updates and read the latest evidence before repeating a request. Fork-CI approval requires a maintainer to inspect the proposed workflow/code changes; authors can link the waiting run.\n\n## License\n\nBy contributing, you agree to the repository's [MIT License](LICENSE). Submit only work you created or have the right to contribute."},"source-eca12c0a30e25b4b-s1":{"body":"来源：`CONTRIBUTING.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Contributing to Archify\n\nArchify is Agent-first: people describe systems, and the Skill, typed JSON, renderers, validators, and delivery receipts produce reproducible diagrams. Keep each contribution focused on one user-visible behavior or one tightly related delivery slice. Maintainers and Agents reviewing a PR or a revised head follow [Reviewing](REVIEWING.md).\n"},"source-eca12c0a30e25b4b-s2":{"body":"来源：`CONTRIBUTING.md:5-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Choose the right path\n\n- Renderer, validator, package, or Viewer defect: use the [bug report form](.github/ISSUE_TEMPLATE/bug-report.yml).\n- Reproducible real-world diagram: use the [showcase form](.github/ISSUE_TEMPLATE/showcase.yml).\n- New schema fields, defaults, acceptance rules, installation/export contracts, or broad product behavior: agree on value, compatibility, and non-goals before substantial implementation. Link the issue or recorded maintainer decision; reuse an existing agreed scope.\n- Narrow fixes and small documentation or test corrections can proceed with a concrete reproduction or rationale; a separate planning issue is unnecessary.\n- Security vulnerabilities: follow [SECURITY.md](SECURITY.md).\n\nDo not include secrets, access tokens, credentials, private repository content, personal data, or customer data in fixtures, logs, screenshots, artifacts, or package tests.\n"},"source-eca12c0a30e25b4b-s3":{"body":"来源：`CONTRIBUTING.md:15-28`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Prepare a reviewable change\n\nStart from the latest `main`. Check whether its existing controls already solve the reported case. Record the comparison base and candidate head.\n\nUse Draft for unresolved scope or early implementation feedback. At this stage, provide the smallest reproduction and relevant checks. Prepare broad integration evidence and generated artifacts once the approach is settled.\n\nBefore requesting final review, explain:\n\n- The current-main trigger, intended outcome, and why the benefit justifies the implementation and ongoing maintenance cost.\n- The changed behavior and shared callers, existing behavior that must remain stable, and any intended compatibility changes.\n- The applicable checks, actual results, and reproducible evidence links.\n\nUse [the PR template](.github/PULL_REQUEST_TEMPLATE.md); link existing receipts or CI output instead of transcribing long logs. Classify impact by behavior and callers, not file extension or diff size.\n"},"source-eca12c0a30e25b4b-s4":{"body":"来源：`CONTRIBUTING.md:29-41`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Choose evidence by impact\n\n| Impact | Typical change | Evidence to prepare |\n| --- | --- | --- |\n| Text or review policy | Explanatory prose, links, contributor/reviewer procedure | Check content, links, and consistency with affected templates or automation. No local renderer suite for repository-only prose. |\n| Local behavior | One CLI path, focused test correction | Reproduction or rationale, affected tests, and relevant failure/compatibility cases. |\n| Shared behavior | Geometry, text measurement, shared Viewer, evidence or delivery helpers | Trace callers; identify affected modes and contracts; compare fixed representative inputs on base and candidate, including relevant historical failures. |\n| Contract change | Schema, defaults, validation acceptance, Skill or authoring instructions | Agreed scope and explicit allowed/preserved behavior, plus local/shared evidence appropriate to the implementation. |\n\nSkill instructions, authored examples, build inputs, and generated-site sources are behavioral inputs even when they look like documentation. Policy changes need process review; runtime evidence depends on whether they affect runtime inputs.\n\nStart with focused checks for the affected behavior. Use the full `npm test` suite from `archify/` when shared behavior, broad changes, or findings require wider coverage. Final review needs sufficient evidence for the impact above; relevant CI results can supply that coverage without repeating the same run locally. Identify the revision and coverage of reused results, and explain material gaps. Required remote CI and branch protection still apply.\n"},"source-eca12c0a30e25b4b-s5":{"body":"来源：`CONTRIBUTING.md:42-50`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Product and compatibility contracts\n\n- Existing schema-v1 typed JSON remains valid unless a reviewed change explicitly introduces a breaking rule and migration path.\n- Preserve authored topology and intent; explicit geometry remains authoritative unless the contract says otherwise. Consult the [authoring contract](archify/references/authoring-contract.md) and relevant renderer documentation for details.\n- `standard` preserves broad compatibility. A new `showcase` failure must identify a real, repairable defect and avoid rejecting necessary routing.\n- Agent-facing failures belong in `diagnostics[]`: use a stable `code`, precise `subject`, concrete `evidence`, and executable `supportedFixes`. Preserve non-zero CLI exits and machine-readable receipts for failed stages.\n- A validation rule expressing taste should begin with evidence or a warning. Before making it a hard error, check legitimate obstacles, shared ports, explicit routes, nested boundaries, and existing examples.\n- Keep one canonical contract per behavior. Link the existing source instead of copying CLI stages, receipt fields, or error tables.\n"},"source-eca12c0a30e25b4b-s6":{"body":"来源：`CONTRIBUTING.md:51-73`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Local setup and verification\n\nThe renderer package is the repository root `package.json`. Skill sources stay in `archify/`.\n\n```sh\nnpm ci\nnpm test\n```\n\nTest through public behavior such as `render`, `validate`, `deliver`, `visual-check`, or final SVG/HTML. Behavioral fixes should include a regression that demonstrates the original failure. Private helper checks can supplement that evidence.\n\nFor geometry and layout changes, use the smallest redacted JSON reproduction, relevant checked-in examples, and frozen compatibility fixtures. Compare base and candidate with the same inp rve attribution; showcase acceptance is not a controlled model-quality benchmark.\n"},"source-eca12c0a30e25b4b-s9":{"body":"来源：`CONTRIBUTING.md:106-111`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Automated review\n\nCodeRabbit provides advisory feedback under the repository [configuration](.coderabbit.yaml). Answer with relevant evidence or explain why a finding does not apply. Missing evidence is an unresolved claim, not proof of a code defect. Maintainers settle disputed scope; required CI and the maintainer's merge decision remain separate.\n\nFor retriggering or pausing reviews, use the official [review commands](https://docs.coderabbit.ai/reference/review-commands) and check the updated results. Bot assessments are snapshots at the stated revision; refresh stale checks after description or CI updates and read the latest evidence before repeating a request. Fork-CI approval requires a maintainer to inspect the proposed workflow/code changes; authors can link the waiting run.\n"},"source-eca12c0a30e25b4b-s10":{"body":"来源：`CONTRIBUTING.md:112-114`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## License\n\nBy contributing, you agree to the repository's [MIT License](LICENSE). Submit only work you created or have the right to contribute."},"folder:skill:archify":{"body":"# archify\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-87493bb61ef9d10a":{"body":"# archify/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: archify\ndescription: Create polished, validated architecture, workflow, sequence, data-flow, and lifecycle/state diagrams as explorable standalone HTML with inline SVG, dark/light themes, optional trace motion, and PNG/JPEG/WebP/SVG/WebM export. Accept plain-language requirements or pasted Mermaid flowchart, sequenceDiagram, and stateDiagram input; inspect repository evidence when the diagram must reflect real code. Use when the user asks to visualize system architecture, infrastructure, cloud/security/network topology, technical workflows, API call sequences, request lifecycles, data pipelines, ETL/ELT, data lineage, state machines, or to convert/beautify Mermaid.\nlicense: MIT\nmetadata:\n  version: \"2.17\"\n  author: tt-a1i\n  based_on: Cocoon-AI/architecture-diagram-generator (MIT, v1.0)\n---\n\n# Archify\n\nCreate a self-contained, interactive HTML diagram from a small typed JSON specification. Static output is the default; enable motion only when the user asks for a demo or presentation.\n\n## Fast authoring path\n\nUse this bounded path for ordinary generation. Do not read the optional Viewer Runtime reference unless the user asks about those features.\n\n1. Choose `architecture`, `workflow`, `sequence`, `dataflow`, or `lifecycle` from the question.\n2. Read one matching schema in `schemas/`, `schemas/common.schema.json`, and one matching JSON example in `examples/`. Read only those files. Fresh authorship means new stable IDs, domain wording, and layout; use the example for field shape, not facts. New workflow sources use `schema_version: 2` and its readable layout contract; keep `schema_version: 1` only when preserving an existing workflow's fixed geometry. When real product identity matters, query `node scripts/archify.mjs brands \"\u003cname>\" --json`; read `references/brand-marks.md` only for an unknown brand with a user-provided URL.\n3. Artifact first: the next tool action must write the candidate. Write the candidate before inspecting renderer internals. Do not plan exact coordinates in prose. Start with one clear main path, short side branches, sparse labels, and at most 12 primary nodes. Set `meta.quality_profile` to `\"showcase\"` unless the user explicitly requests a dense `standard` map. Start with automatic routes and labels. Do not add `via`, `channelX`, `channelY`, or `labelAt` before a diagnostic calls for one; apply at most one diagnosed geometry control per repair.\n4. Validate after every candidate edit and immediately before handoff:\n\n   ```bash\n   node scripts/archify.mjs validate \u003ctype> \u003ccandidate.json> --quality showcase --json\n   ```\n\n   A receipt with only 4 artifact checks is basic validation, never showcase acceptance. A showcase pass must report all 9 artifact checks with 0 composition errors and 0 warnings. If the candidate omits or misspells the exact `meta.quality_profile` field, fix it before geometry. For a workflow v2 geometry diagnosis, run `node scripts/archify.mjs validate workflow \u003ccandidate.json> --layout-json` and use the stable compiler receipt; solver internals are not authoring controls. A passing final validation freezes the candidate: never edit it afterward.\n5. For a delivered HTML, `deliver` is the final acceptance command:\n\n   ```bash\n   node scripts/archify.mjs deliver \u003ctype> \u003ccandidate.json> \u003coutput.html> --quality showcase --json\n   ```\n\n   A non-zero exit can never be described as success. A failed delivery preserves any previous output, so do not run `visual-check` on that path: it would inspect the stale last-good artifact, not the failed candidate. If validation fails, change only the diagnosed `subject`, verify `evidence`, choose from `supportedFixes`, and rerun. Continue focused correction while the objective error count reaches a new minimum. If two consecutive rounds do not improve that best count, stop and report the unresolved diagnostics truthfully.\n\n## Update awareness\n\nAfter the first candidate exists, run the packaged checker `scripts/check-update.mjs` once with Node and continue the requested workflow. If the command cannot run, continue without mentioning the check.\n\n- For `silent`, continue without mentioning the update check.\n- For `update_available`, show one compact notice in the user's conversation language with the installed version, latest version, the checker's fixed local summary, and official release-notes link. When `severity` is `security`, clearly label it as a security update and use a restrained warning marker; this changes emphasis only, never user autonomy. Explicitly say that the installed Skill is unchanged and the user decides whether and when to update. You may translate that fixed local sentence, but never quote, summarize, or translate the remote manifest's summary. After the notice is visible, acknowledge its exact `eventKey` by running the same checker with `--ack \"\u003ceventKey>\"`, then continue the user's original task.\n\nThe notice is information, not permission. Keep the installed version unchanged; this v0.1 workflow never downloads, installs, or executes an update, and silence is never consent.\n\nDo not read `renderers/shared/geometry.mjs`, renderer source, validator source, tests, or benchmarks before the first candidate. Inspect implementation only for an unsupported internal diagnostic or after two focused repairs fail.\n\nWorkflow note: use schema v2 for new workflows; preserve schema v1 when an\nexisting source needs fixed legacy geometry. Keep semantic edge labels and act\non the compiler diagnostic. The canonical layout, pin, migration, and receipt\ncontract is in [`renderers/workflow/README.md`](renderers/workflow/README.md#layout-contracts).\n\nLifecycle note: phase columns `0..4` occupy the main rail; event/terminal column `N` in `0..2` aligns exactly beneath main column `N + 2`. A recoverable state uses `type: \"failure\"` plus a real transition back to the active state.\n\n## Type router\n\n| Type | Use for |\n|---|---|\n| `architecture` | Components, services, cloud/security boundaries, infrastructure |\n| `workflow` | Processes, approval gates, tool calls, runbooks, CI/CD |\n| `sequence` | API call chains, request lifecycles, async traces, returns |\n| `dataflow` | Pipelines, ETL/ELT, lineage, governance, consumers |\n| `lifecycle` | State/status transitions, retries, waiting and terminal states |\n\nWhen ambiguous, run `node scripts/archify.mjs guide \"\u003cscenario>\" --json`. Scenario proof examples are structural references, not facts to copy.\n\n## Mermaid input\n\nRead Mermaid for topology and meaning, then author fresh Archify JSON; do not mechanically render Mermaid styling.\n\n- `flowchart` / `graph` → `workflow`, or `architecture` for a component map.\n- `sequenceDiagram` → `sequence`; participants become semantic participants and arrows become messages.\n- `stateDiagram` → `lifecycle`; states and transitions retain meaning, not Mermaid style.\n\n## Authoring invariants\n\n- One obvious main path; side branches leave the nearest main-path node. Remove low-value edges before adding routing controls.\n- Omit `meta.visual_preset` by default so every diagram opens in `classic`, regardless of whether its resolved color mode is light or dark. Color mode and visual preset are independent: switching Light / Dark must preserve the current preset. Set `signal-flow`, `blueprint`, or `editorial` only when the user explicitly requests that visual style.\n- Omit `meta.subtitle` by default. Never invent a subtitle that restates the title, nodes, or cards; include one short supporting line only when the user explicitly asks for it.\n- Treat the standalone desktop viewer as a first-screen artifact by default, not a shallow strip. Generate one responsive artifact for laptops and external displays—never device-specific HTML or alternate topology. The viewer may adapt only the outer reading width from the live viewport height; it must preserve the authored SVG/viewBox, proportions, semantic geometry, and normal document flow. On a wide or tall desktop, use enough authored vertical rhythm that the diagram panel and its necessary conclusion cards occupy the screen as a balanced whole; runtime scaling cannot repair an over-compressed Y layout or an undersized explicit `meta.viewBox`. Before handoff, open the real HTML at 1440×900, 1600×1000, and 1920×1080; additionally check 2048×1320 whenever the composition is intended for a large desktop display. Require `document.documentElement.scrollWidth \u003c= window.innerWidth` and `scrollHeight \u003c= window.innerHeight` at every checked size, while visually checking that the diagram remains comfortably readable and vertically balanced at the largest checked viewport. Repair overflow by removing only genuinely redundant content or compacting spacing before shrinking nodes, labels, or the main panel. If the largest viewport still has a conspicuous empty lower band at the viewer's width cap, redistribute authored Y positions and increase the viewBox height proportionally; do not add filler copy or decorative cards. Never counterfeit a pass with `overflow: hidden`, clipped content, an internal diagram scroller, stretched SVG height, or smaller typography. Narrow/mobile layouts may scroll vertically when containment requires it.\n- Omit `meta.legend` for the truthful `auto` default. When needed, use only `mode: auto|all|hidden` and renderer-supported `entries.\u003ckind>.label|visible`; labels never change semantics.\n- Choose one primary authored language from an explicit user choice; otherwise follow the request or conversation's dominant language. `meta.locale` controls only renderer-owned Viewer UI: use `\"en\"` or `\"zh-CN\"` for the corresponding supported primary language. For every other language, omit `meta.locale` and explicitly disclose that the fixed Viewer UI and `\u003chtml lang>` fall back to English. The renderer never translates authored content. See `references/authoring-contract.md` for details.\n- Preserve exact product names, code identifiers, commands, protocols, API paths, and environment names. They may remain English inside localized copy, but never justify leaving the surrounding explanatory prose in another language.\n- Brand identity is optional and explicit. Put a canonical built-in ID in `brand` when the node names that real product. If no preset matches and the user supplied the official HTTP(S) URL, first run `node scripts/archify.mjs brands capture \"\u003curl>\" --json`, then author the returned digest-pinned `brand` object. Render and validate never perform an unpinned capture. Otherwise omit `brand`. Never infer a brand from a vague role such as \"database\", and never let a badge replace the semantic `type`, label, or relationship facts.\n- For sequence diagrams, omit `meta.column_fit` for the stable `fixed` layout. Set it to `\"spread\"` when a wide viewBox would otherwise leave unused horizontal space or when meaningful participant labels do not fit the fixed boxes; do not shorten semantic labels before trying `spread`.\n- Component types are `frontend`, `backend`, `database`, `cloud`, `security`, `messagebus`, and `external`; variants are `default`, `emphasis`, `security`, and `dashed`.\n- Relationship labels are semantic data. When one collides, move the label, adjust the route or spacing, then shorten the wording while preserving meaning. Omit only wording that is already fully implied by both endpoints and contains no protocol, action, direction, synchronous/asynchronous behavior, or cross-boundary mechanism. Preserve every meaningful label; deleting it is not a geometry repair. If a relationship starts unlabeled because its endpoints fully imply it, explain why the wording is redundant; this is a semantic authoring choice, not a geometry repair.\n- Omit `meta.engineering_profile` by default. Region, cluster, and security boundary wording do not by themselves enable it. Enable `deployment-ownership` only when the user explicitly asks for a production deployment topology, ownership handoff, or fail-closed deployment review and the source facts are known. Once enabled, must not remove the engineering profile merely to pass validation; repair the facts or report the diagnostics truthfully.\n- Spacing means clear gap, not center distance. For a relationship label, clear gap must exceed its measured mask width; follow the label-preserving repair order.\n- Automatic routes own their endpoint sides. A side is a direction contract: the first and final segment must leave/enter perpendicular to that side.\n- Automatic Port Spread is a default renderer behavior for architecture, workflow, data-flow, and lifecycle. It skips single relationships and explicit `via`, `channelX`, `channelY`, `labelAt`, or non-`auto` routes. Near parallel ports use an outside bridge so automatic routing cannot create a sub-8px segment or sub-16px interior turn. Architecture separately keeps unobstructed facing automatic ports (`left`/`right` or `top`/`bottom`) on one shared axis when their offset is under 16px and both ports retain corner clearance. If exactly one endpoint was spread, only the unshared endpoint may move onto that axis; if both endpoints were spread, keep the outside bridge so competing ports remain distinct.\n- Never accept an edge crossing an unrelated opaque node, an ambiguous shared corridor, or a relationship label masking another route.\n\nRead `references/authoring-contract.md` only when you need field enums, spacing math, geometry repair rules, repository evidence, or mode-specific placement.\n\n## Delivery\n\nUse `validate` during repair and `deliver` once for final acceptance. Delivery freezes the exact specification bytes into a private same-directory snapshot, renders and checks that snapshot, atomically commits the HTML, and reports SHA-256 plus byte counts for both specification and artifact. This is deterministic artifact evidence; it does not exercise the Viewer in a browser.\n\nAfter delivery, collect bounded desktop evidence without modifying or rerendering the trusted HTML:\n\n```bash\nnode scripts/archify.mjs visual-check \u003coutput.html> --json\n```\n\n`visual-check` collects automated browser evidence from the exact delivered HTML without modifying or rerendering it. Its machine-readable measurements and screenshots do not approve perceptual polish. Follow `references/delivery-contract.md` for the canonical receipt fields, coverage, sidecars, exit behavior, and supplementary manual-record requirements.\n\nKeep the three claims separate: `deliver` proves deterministic artifact checks, `visual-check` proves bounded behavior in a real browser, and perceptual visual review requires an actual human or image-capable reviewer. Report browser evidence and perceptual review independently. An unconstrained glance can support only perceptual review; use the canonical delivery contract when recording supplementary manual browser work or handling an environmental failure.\n\nAdd `--open` only when the user wants an immediate local preview. For an active desktop authoring loop, the optional command is:\n\n```bash\nnode scripts/archify.mjs preview \u003ctype> \u003cinput>.json \u003coutput>.html --quality showcase\n```\n\nNever start preview by default. Read `references/delivery-contract.md` when using preview, repository evidence, export receipts, visual review, or post-commit opening.\n\n## Optional viewer capabilities\n\nGenerated HTML already contains theme switching, pan/zoom, search, focus, relationship tracing, semantic views, presentation, and truthful exports. These are reader capabilities, not extra authoring work. `meta.animation: \"trace\"` is opt-in; `meta.views` is optional and should contain at most five curated chapters.\n\nRead `references/viewer-runtime.md` only when the user explicitly asks for Share Cards, Route/Reach cards, motion, guided stories, deep links, presentation, search/focus, or another Viewer Runtime feature.\n\n## Setup and fallback\n\nNo install is required inside the skill package. Verify with:\n\n```bash\nnode scripts/archify.mjs doctor\nnode scripts/archify.mjs demo \u003coutput-directory>\n```\n\nWhen shell access is unavailable, hand-place architecture SVG into `assets/template.html`, use CSS semantic classes rather than inline colors, and follow the visual review contract in `references/delivery-contract.md`.\n\n## Output\n\nReturn the checked HTML path, diagram type, validation summary, specification/artifact receipt, browser-evidence status, and truthful visual-review status. Do not claim success for a non-zero command or claim visual inspection you did not perform."},"source-87493bb61ef9d10a-s1":{"body":"来源：`archify/SKILL.md:11-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Archify\n\nCreate a self-contained, interactive HTML diagram from a small typed JSON specification. Static output is the default; enable motion only when the user asks for a demo or presentation.\n"},"source-87493bb61ef9d10a-s2":{"body":"来源：`archify/SKILL.md:15-36`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Fast authoring path\n\nUse this bounded path for ordinary generation. Do not read the optional Viewer Runtime reference unless the user asks about those features.\n\n1. Choose `architecture`, `workflow`, `sequence`, `dataflow`, or `lifecycle` from the question.\n2. Read one matching schema in `schemas/`, `schemas/common.schema.json`, and one matching JSON example in `examples/`. Read only those files. Fresh authorship means new stable IDs, domain wording, and layout; use the example for field shape, not facts. New workflow sources use `schema_version: 2` and its readable layout contract; keep `schema_version: 1` only when preserving an existing workflow's fixed geometry. When real product identity matters, query `node scripts/archify.mjs brands \"\u003cname>\" --json`; read `references/brand-marks.md` only for an unknown brand with a user-provided URL.\n3. Artifact first: the next tool action must write the candidate. Write the candidate before inspecting renderer internals. Do not plan exact coordinates in prose. Start with one clear main path, short side branches, sparse labels, and at most 12 primary nodes. Set `meta.quality_profile` to `\"showcase\"` unless the user explicitly requests a dense `standard` map. Start with automatic routes and labels. Do not add `via`, `channelX`, `channelY`, or `labelAt` before a diagnostic calls for one; apply at most one diagnosed geometry control per repair.\n4. Validate after every candidate edit and immediately before handoff:\n\n   ```bash\n   node scripts/archify.mjs validate \u003ctype> \u003ccandidate.json> --quality showcase --json\n   ```\n\n   A receipt with only 4 artifact checks is basic validation, never showcase acceptance. A showcase pass must report all 9 artifact checks with 0 composition errors and 0 warnings. If the candidate omits or misspells the exact `meta.quality_profile` field, fix it before geometry. For a workflow v2 geometry diagnosis, run `node scripts/archify.mjs validate workflow \u003ccandidate.json> --layout-json` and use the stable compiler receipt; solver internals are not authoring controls. A passing final validation freezes the candidate: never edit it afterward.\n5. For a delivered HTML, `deliver` is the final acceptance command:\n\n   ```bash\n   node scripts/archify.mjs deliver \u003ctype> \u003ccandidate.json> \u003coutput.html> --quality showcase --json\n   ```\n\n   A non-zero exit can never be described as success. A failed delivery preserves any previous output, so do not run `visual-check` on that path: it would inspect the stale last-good artifact, not the failed candidate. If validation fails, change only the diagnosed `subject`, verify `evidence`, choose from `supportedFixes`, and rerun. Continue focused correction while the objective error count reaches a new minimum. If two consecutive rounds do not improve that best count, stop and report the unresolved diagnostics truthfully.\n"},"source-87493bb61ef9d10a  event/terminal column `N` in `0..2` aligns exactly beneath main column `N + 2`. A recoverable state uses `type: \"failure\"` plus a real transition back to the active state.\n"},"source-87493bb61ef9d10a-s4":{"body":"来源：`archify/SKILL.md:55-66`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Type router\n\n| Type | Use for |\n|---|---|\n| `architecture` | Components, services, cloud/security boundaries, infrastructure |\n| `workflow` | Processes, approval gates, tool calls, runbooks, CI/CD |\n| `sequence` | API call chains, request lifecycles, async traces, returns |\n| `dataflow` | Pipelines, ETL/ELT, lineage, governance, consumers |\n| `lifecycle` | State/status transitions, retries, waiting and terminal states |\n\nWhen ambiguous, run `node scripts/archify.mjs guide \"\u003cscenario>\" --json`. Scenario proof examples are structural references, not facts to copy.\n"},"source-87493bb61ef9d10a-s5":{"body":"来源：`archify/SKILL.md:67-74`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Mermaid input\n\nRead Mermaid for topology and meaning, then author fresh Archify JSON; do not mechanically render Mermaid styling.\n\n- `flowchart` / `graph` → `workflow`, or `architecture` for a component map.\n- `sequenceDiagram` → `sequence`; participants become semantic participants and arrows become messages.\n- `stateDiagram` → `lifecycle`; states and transitions retain meaning, not Mermaid style.\n"},"source-87493bb61ef9d10a-s6":{"body":"来源：`archify/SKILL.md:75-95`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Authoring invariants\n\n- One obvious main path; side branches leave the nearest main-path node. Remove low-value edges before adding routing controls.\n- Omit `meta.visual_preset` by default so every diagram opens in `classic`, regardless of whether its resolv specification/artifact receipt, browser-evidence status, and truthful visual-review status. Do not claim success for a non-zero command or claim visual inspection you did not perform."},"source-6ede816b9072cf17":{"body":"# REVIEWING.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/archify-review/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Reviewing Archify changes\n\nUse this guide for initial and revised PR reviews. Judge the user value, implementation and ongoing maintenance cost, and impact on existing behavior. [Contributing](CONTRIBUTING.md#choose-evidence-by-impact) describes contribution and evidence requirements.\n\n## Understand the problem and approach\n\nRecord the current main/base and candidate head. Read the linked issue or agreed scope and check the current-main behavior where feasible. Separate the reported problem from the proposed implementation.\n\nIdentify who benefits and whether the approach is worth maintaining. Consider whether existing capabilities or a smaller change would solve the problem. For a new default, schema field, or acceptance policy, clarify the value and compatibility tradeoff early. Reuse decisions already made in the issue or authorized task.\n\nIf a decision is missing, explain how it affects the review and continue checks that do not depend on it. Narrow fixes can proceed on their reproduction without another planning exercise.\n\n## Match investigation to impact\n\nCheck the author's [impact classification](CONTRIBUTING.md#choose-evidence-by-impact) against the changed paths and callers. Shared helpers, templates, and authoring instructions may affect more modes than the title suggests.\n\nChoose checks that resolve the important uncertainties, including relevant historical failures and authored constraints. Broaden the investigation when findings or coverage gaps warrant it. Repository-only policy changes need consistency checks, not layout screenshots.\n\nUse existing tests, receipts, and browser tools. For behavior comparisons, use fixed inputs on the recorded base and candidate:\n\n- Account for changed and preserved topology, meaningful labels, explicit geometry, and relevant failure behavior.\n- For affected visible behavior, inspect the intended differences and unexplained changes under comparable browser conditions. A pixel difference identifies a change; it does not judge its quality.\n- When a fix also changes a validator or golden baseline, evaluate that acceptance change explicitly. Fresh generated output proves consistency with the candidate, not compatibility with the base.\n- Separate locally reproduced results, author/CI evidence, reused evidence, and unknowns. Keep browser checks and perceptual review distinct.\n\nEvidence should be sufficient for the affected contract. Avoid rebuilding an unchanged artifact or replaying unaffected checks merely to restate existing results.\n\n## Give actionable feedback\n\nLead with whether the approach is worthwhile, then explain findings and a clear disposition:\n\n- **Blocking defect:** trigger, impact, supporting evidence, and the behavior that must be corrected.\n- **Required evidence or scope decision:** the unresolved claim, why it matters to acceptance, and the smallest check or decision that would settle it. An unverified risk is not a reproduced defect.\n- **Suggestion:** a worthwhile improvement outside the acceptance conditions; personal preference alone does not block.\n- **Ready:** the agreed behavior is delivered, relevant evidence is sufficient, and no acceptance blocker remains.\n\nConsolidate scope and compatibility concerns in the first substantive review where possible. Explain any later blocker with newly found evidence, an overlooked acceptance requirement, or a new diff. Record unrelated issues separately instead of growing the PR's scope.\n\nAssess bot findings against the current diff and existing evidence before forwarding them. Explain duplicate or inapplicable findings; use the same standard of evidence as for your own feedback.\n\n## Re-review and finish\n\nCompare against the last reviewed head, resolve outstanding findings, and inspect added changes. Check intervening main changes for effects on the earlier assessment. Expand review when those changes invalidate scope or evidence; do not treat an old pass as proof of new behavior.\n\nFinish when the agreed outcome is delivered, relevant evidence is sufficient, and no acceptance blockers remain. Report non-blocking limitations. A review conclusion does not itself authorize a GitHub approval or merge; follow the authorized action and [final integration requirements](CONTRIBUTING.md#final-integration-and-follow-up)."},"source-6ede816b9072cf17-s1":{"body":"来源：`REVIEWING.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Reviewing Archify changes\n\nUse this guide for initial and revised PR reviews. Judge the user value, implementation and ongoing maintenance cost, and impact on existing behavior. [Contributing](CONTRIBUTING.md#choose-evidence-by-impact) describes contribution and evidence requirements.\n"},"source-6ede816b9072cf17-s2":{"body":"来源：`REVIEWING.md:5-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Understand the problem and approach\n\nRecord the current main/base and candidate head. Read the linked issue or agreed scope and check the current-main behavior where feasible. Separate the reported problem from the proposed implementation.\n\nIdentify who benefits and whether the approach is worth maintaining. Consider whether existing capabilities or a smaller change would solve the problem. For a new default, schema field, or acceptance policy, clarify the value and compatibility tradeoff early. Reuse decisions already made in the issue or authorized t n-and-follow-up)."},"source-f6ed156e4bf5c791":{"body":"# SECURITY.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：CONTRIBUTING.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Security Policy\n\nArchify welcomes responsible security reports. Please report suspected\nvulnerabilities privately so maintainers can investigate and coordinate\nremediation before public disclosure.\n\n## Supported versions\n\nArchify is under active development. Please report vulnerabilities affecting\nthe latest stable release or current `main`.\n\nReports affecting older releases are also welcome. Include the exact version\nor commit so maintainers can determine the affected range. This policy does\nnot promise maintenance or backports for older releases.\n\n## Reporting a vulnerability\n\nUse GitHub's private vulnerability reporting for this repository when that\noption is available.\n\nInclude, when available:\n\n- the affected Archify version or commit;\n- the installation method, operating system, Node.js version, and relevant\n  host or agent;\n- the affected command, component, or entry point;\n- a minimal reproduction or proof of concept;\n- the security impact and conditions required to reproduce it;\n- a suggested mitigation or workaround, if known.\n\nUse a minimal, redacted reproduction. Do not publish exploit details,\ncredentials, access tokens, secrets, private repository content, personal\ndata, or customer data in public issues, discussions, pull requests, logs,\nscreenshots, generated artifacts, or package tests.\n\nIf private vulnerability reporting is unavailable, open a public issue asking\nthe maintainers for a private security contact. Do not include vulnerability\ndetails in that issue.\n\n## Coordinated disclosure\n\nPlease keep vulnerability details private while the report is being triaged\nand, when applicable, while a fix is being prepared.\n\nCoordinate public disclosure with the maintainers through the private reporting\nchannel so affected users can be given accurate remediation guidance.\n\n## Non-security bugs\n\nUse [the bug report form](.github/ISSUE_TEMPLATE/bug-report.yml) for\nfunctional, rendering, validation, compatibility, packaging, or documentation\ndefects that do not create a security impact.\n\nIf you are unsure whether a finding is security-sensitive, report it privately."},"source-f6ed156e4bf5c791-s1":{"body":"来源：`SECURITY.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Security Policy\n\nArchify welcomes responsible security reports. Please report suspected\nvulnerabilities privately so maintainers can investigate and coordinate\nremediation before public disclosure.\n"},"source-f6ed156e4bf5c791-s2":{"body":"来源：`SECURITY.md:7-15`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Supported versions\n\nArchify is under active development. Please report vulnerabilities affecting\nthe latest stable release or current `main`.\n\nReports affecting older releases are also welcome. Include the exact version\nor commit so maintainers can determine the affected range. This policy does\nnot promise maintenance or backports for older releases.\n"},"source-f6ed156e4bf5c791-s3":{"body":"来源：`SECURITY.md:16-39`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Reporting a vulnerability\n\nUse GitHub's private vulnerability reporting for this repository when that\noption is available.\n\nInclude, when available:\n\n- the affected Archify version or commit;\n- the installation method, operating system, Node.js version, and relevant\n  host or agent;\n- the affected command, component, or entry point;\n- a minimal reproduction or proof of concept;\n- the security impact and conditions required to reproduce it;\n- a sugges oblem and value\n\nCurrent-main trigger or rationale, intended outcome, why the approach is worth maintaining, and linked issue/agreed scope:\n\n## Stability impact\n\n- Impact class and changed behavior/shared callers: \u003c!-- CONTRIBUTING.md#choose-evidence-by-impact -->\n- Existing behavior preserved / intended compatibility changes / failure behavior:\n\n## Tests run\n\nComparison base and candidate head; applicable commands/results or evidence links. Identify reused evidence by its original revision and explain material coverage gaps. Follow CONTRIBUTING.md#choose-evidence-by-impact; required remote CI still applies.\n\n## Visual evidence\n\nOmit this section for non-visual changes.\n\n- Evidence provided: \u003c!-- screenshots, recordings, or reproducible steps; intended and unexpected differences -->\n- Comparison conditions: \u003c!-- same input, viewport, theme, preset, mode, zoom, page state -->\n- Automated or browser checks:\n- Perceptual visual review: passed / failed / skipped / Not applicable\n\nReport automated or browser evidence separately from perceptual review.\n\n## Generated artifacts\n\nOmit this section if generated outputs are unaffected. Otherwise list regenerated files or linked build evidence, and explain freshness of affected outputs left unchanged."},"source-18813c86948efc57-s1":{"body":"来源：`.github/PULL_REQUEST_TEMPLATE.md:3-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Problem and value\n\nCurrent-main trigger or rationale, intended outcome, why the approach is worth maintaining, and linked issue/agreed scope:\n"},"source-18813c86948efc57-s2":{"body":"来源：`.github/PULL_REQUEST_TEMPLATE.md:7-11`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Stability impact\n\n- Impact class and changed behavior/shared callers: \u003c!-- CONTRIBUTING.md#choose-evidence-by-impact -->\n- Existing behavior ferences/authoring-contract.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：CONTRIBUTING.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Authoring contract\n\nRead this reference only after the Fast authoring path calls for more detail. The schemas and examples remain authoritative.\n\n## Schema lookup\n\nRead both the mode schema and `schemas/common.schema.json`. The mode schemas use `$ref`, so the common file is where shared enums live.\n\n- `componentType`: `frontend`, `backend`, `database`, `cloud`, `security`, `messagebus`, `external`\n- `variant`: `default`, `emphasis`, `security`, `dashed`\n- Relationship IDs use the shared identifier pattern and must be unique in their collection.\n\nDo not invent fields. Use the nearest matching example for structure, then author fresh IDs, wording, facts, and layout.\n\n## Workflow layout contracts\n\nUse schema v2 for new workflows and keep schema v1 when an existing source must\nretain fixed geometry. In both versions, `col` stays in `0..5` and semantic\nedge labels are never deleted as a spacing repair. Do not change only\n`schema_version` when absolute coordinates exist: follow the canonical\n[migration and layout-receipt contract](../renderers/workflow/README.md#migration-and-layout-receipt).\nThe complete normative invariants live in the workflow renderer's\n[layout contracts](../renderers/workflow/README.md#layout-contracts).\n\n## Legend contract\n\nOmit `meta.legend` for the truthful default: `auto` lists only semantic kinds\npresent in typed IR. Use `mode: \"all\"` for a renderer reference or\n`mode: \"hidden\"` to remove the full legend. Under `entries`, only keys listed\nby the selected mode schema are valid; each key accepts `label`, `visible`, or\nboth. `visible: true` may show an unused supported convention, while\n`visible: false` hides it. `hidden` cannot be overridden.\n\nA label override changes reader wording only. Never infer a kind from prose or\nuse the legend to compensate for missing nodes, states, messages, or flows.\nLong labels are measured and wrap into deterministic rows. Architecture's\nimplicit automatic viewBox grows from that same measured footprint. For\nbackwards compatibility, a legacy document with no `meta.legend` may omit an\nimplicit auto legend that cannot fit its explicit viewBox; this never changes\nits typed topology. Adding `meta.legend` makes the presentation intentional and\nstrict: if its resolved labels cannot fit the authored viewBox, shorten or hide\nthem, or widen the viewBox using the emitted diagnostic.\n\n## Language consistency\n\nChoose one primary authored language. An explicit user choice wins; otherwise\nuse the language of the request, or the conversation's dominant language when\nthe request itself is language-neutral. Separately choose the Viewer locale.\nFor supported languages, always write the matching `meta.locale`: `\"en\"` for\nEnglish or `\"zh-CN\"` for Simplified Chinese. The renderer consumes the authored\nlocale without inferring language from diagram strings. Documents that omit it\nremain valid and default to English.\n\n`meta.locale` controls only renderer-owned reader surfaces: `\u003chtml lang>`, the\ndocument-title suffix, default SVG description and focus labels, default legend\nlabels, and fixed Viewer controls, statuses, accessibility names, and errors.\nIt never translates authored content. Apply the primary language separately to\ntitles, subtitles, node and relationship copy, boundaries, lanes, groups,\nguided views, legend label overrides, and cards. A bilingual diagram still\nchooses one primary locale for the Viewer; follow an explicit primary-language\nrequest, then prompt order or conversation dominance.\n\nFor a requested language outside `en` and `zh-CN`, do not write an unsupported\nlocale. Keep every reader-facing authored string in the requested language,\nomit `meta.locale` so the renderer safely uses English, and explicitly tell the\nuser that fixed Viewer UI and `\u003chtml lang>` remain English and the artifact is\nnot fully localized. The fallback applies only to renderer-owned surfaces; it\nnever permits authored copy to fall back to English. Do not silently substitute\n`zh-CN` for another language or Chinese locale.\n\nKeep exact product names, code identifiers, commands, protocols, API paths, and\nenvironment names intact. Those terms may remain English inside localized copy,\nbut surrounding explanatory prose must still use the selected language.\nRenderer-owned default legend labels follow `meta.locale`; author a\n`meta.legend.entries.*.label` override only when the diagram needs different\ndomain wording, and keep that authored override in the primary language.\n\n## Visual preset default\n\nOmit `meta.visual_preset` by default. The renderer then opens the diagram in\n`classic` for both light and dark color modes. Color mode and visual preset are\nindependent viewer state: switching Light / Dark must preserve the current\npreset. Author `signal-flow`, `blueprint`, or `editorial` only when the user\nexplicitly requests that visual style.\n\n## Engineering profile default\n\nOmit `meta.engineering_profile` for an ordinary system architecture. Region,\ncluster, and security boundary wording do not by themselves enable an\nengineering profile. Enable `deployment-ownership` only when the user\nexplicitly asks for a production deployment topology, ownership handoff, or\nfail-closed deployment review and the source facts are known. Once enabled,\ndo not remove the engineering profile merely to pass validation; repair the\nauthored facts or report the diagnostics truthfully.\n\n## Title hierarchy\n\nUse one concise title and let the diagram carry the explanation. Omit\n`meta.subtitle` by default, and never use it to restate the title, nodes, edges,\nor cards. Include one short supporting line only when the user explicitly asks\nfor a subtitle; an omitted or blank subtitle must not leave an empty visual row\nin the generated viewer.\n\n## Executable geometry rules\n\n- Node anchors start at side midpoints. `left`/`right` change the horizontal endpoint; `top`/`bottom` change the vertical endpoint. For an automatic Architecture relationship, unobstructed facing ports whose axis offset is under 16px may share one horizontal or vertical axis when both endpoints retain the 16px corner gutter. If exactly one endpoint belongs to a spread group, only its unshared counterpart moves; relationships spread at both endpoints keep their distinct ports and outside bridge.\n- A side is a direction contract. The first and final route segment must be perpendicular and outward/inward in the named direction.\n- Automatic Port Spread is a default renderer behavior for architecture, workflow, data-flow, and lifecycle diagrams. Shared automatic endpoints spread deterministically and symmetrically with a 16px corner gutter. It does not apply to sequence messages, single relationships, or explicit `via`, `channelX`, `channelY`, `labelAt`, or non-`auto` routes.\n- Showcase route rhythm: every nonzero segment must be at least 8px; every interior segment must be at least 16px. When spread ports are nearly parallel, the router uses a 24px endpoint stub and a 16px outside bridge instead of manufacturing a tiny dogleg.\n- Shared endpoint corridors are allowed only when they remain semantically unambiguous. Unrelated collinear overlap of 8px or more fails showcase.\n- Container borders are intentional pass-through geometry, but a long edge running along a structural border is not.\n- An edge crossing an unrelated opaque node is always a hard failure, independent of quality profile.\n\n### Spacing and labels\n\nSpacing recommendations mean clear gap between boxes, not center distance. A 200px center distance between 165px-wide nodes leaves only 35px of clear gap.\n\nFor a relationship label, require:\n\n```text\nclear gap > label mask width + 8px breathing room\nlabel mask width ≈ 6.5px × ASCII units + 13px\nCJK characters count as two units\n```\n\nRelationship labels are semantic data. If the gap is too small, move the label,\nadjust the route or spacing, then shorten the wording while preserving meaning.\nOmit only wording already fully implied by both endpoints and carrying no\nprotocol, action, direction, synchronous/asynchronous behavior, or\ncross-boundary mechanism. Preserve every meaningful label.\nDeleting it is not a spacing repair. If a relationship starts unlabeled because\nits endpoints fully imply it, explain why the wording is redundant; this is a\nsemantic authoring choice, not a spacing repair. In workflow v2, let the compiler\nallocate its measured mask before applying a diagnosed `labelAt`,\n`labelDx`/`labelDy`, or `labelSegment`. Apply one diagnosed geometry control at\na time.\n\n### Repair order\n\n1. Fix missing/invalid `meta.quality_profile` and schema errors.\n2. Fix node overlap or out-of-range placement.\n3. Fix edge-through-node and endpoint-direction errors.\n4. Fix crossings, ambiguous corridors, border runs, and route rhythm.\n5. Fix label-to-node, label-to-label, then label-to-route clearance.\n\nRun `validate` after every edit. Consume `diagnostics[]` by stable `code`, exact `subject`, measured `evidence`, and `supportedFixes`. If the diagnostic gives `labelAt`, use that point instead of estimating another offset.\n\n## Mode placement\n\n### Architecture\n\nUse one left-to-right spine with short vertical branches. Prefer 6–12 primary components and group only real ownership, trust, process, or deployment boundaries. Boundaries do not replace relationships.\n\nGrid placement is preferred when the schema supports it. Free positions are appropriate for a bounded exception, not for prose-level coordinate planning. Keep external actors outside the system boundary when that is factually true.\n\n### Workflow\n\nLanes express responsibility or phase. Columns `0..5` express logical\nprogression. Start new workflows on `readable-v2`; retain `fixed-v1` only for\nlegacy geometry compatibility. Keep the happy path monotonic, preserve semantic\nedge labels, and route retries and exception returns outside the main lane\ncorridor.\n\n### Sequence\n\nParticipants are ordered by conversation role. Messages own their vertical order. Use return/async/security variants for meaning, not decoration; sequence does not use Automatic Port Spread.\n\n### Dataflow\n\nStages express transformation or custody. Rows separate parallel streams. Label only data contracts, classifications, or cross-boundary movement that is not obvious.\n\n### Lifecycle\n\nMain phases use columns `0..4`; event and terminal bands use columns `0..2`.\nEvent/terminal column `N` aligns to the same x coordinate as main column\n`N + 2`. A recoverable failure needs a real transition back to an active state.\nA card or guided view saying “retry” is not topology.\n\n## Repository evidence\n\nWhen an architecture diagram must reflect real code, inspect repository\nentrypoints, runtime boundaries, storage, transports, and deployment\nconfiguration before authoring. Record only evidence you actually verified.\n`--repo-root \u003cpath>` is architecture-only and is accepted by architecture\n`render`, `validate`, `deliver`, `preview`, and `compare`; workflow, sequence,\ndataflow, and lifecycle reject it. Never infer runtime causality from file\nproximity or naming alone.\n\nDeclare `meta.repository.url` and one full 40-character `revision`, then attach\n`components[].sources` with repository-relative `path`, optional `line`,\n`end_line`, and `label`. Verification reads blobs at that commit, independently\nof working-tree edits. Verification ignores local Git replacement refs, including\nthose selected by `GIT_REPLACE_REF_BASE`, and always reads the original objects\nat the pinned SHA. It does not change repository configuration or delete\nreplacement refs.\nA matching local origin, available commit, bounded path,\nblob, and valid line range are required in every link mode. Verification is\nlocal and makes no remote requests; it establishes neither public availability\nnor the current reader's access rights.\n\n`link_mode` defaults to `web`. GitHub and Gitee HTTPS repository URLs generate\nrevision-pinned links; their public hosts select the provider automatically.\nOptional `provider: \"github\"` or `\"gitee\"` must agree with the host. Existing\nGitHub declarations and default delivery receipt fields remain compatible.\n\n```json\n{\n  \"url\": \"https://gitee.com/team/service\",\n  \"revision\": \"0123456789abcdef0123456789abcdef01234567\",\n  \"provider\": \"gitee\"\n}\n```\n\nFor an internal or unsupported forge, select `link_mode: \"local-only\"`. The\nViewer retains SRC markers, searchable file paths, line ranges, and revision\nlabels without repository or source hyperlinks. The evidence receipt adds\n`linkMode: \"local-only\"`. `url` remains required as the expected origin identity;\nlocal-only disables links, not identity verification. A repository without an\norigin is not supported.\n\n```json\n{\n  \"url\": \"http://git.internal:3000/Platform/Services/service\",\n  \"revision\": \"0123456789abcdef0123456789abcdef01234567\",\n  \"link_mode\": \"local-only\"\n}\n```\n\nLocal-only accepts HTTP(S), `git@host:path`, and `ssh://git@host[:port]/path`\naddresses, including nested namespaces. Declare a credential-free address;\nHTTP(S) credentials on the checkout's origin are ignored for identity and\nredacted from diagnostics. Hostnames compare case-insensitively; repository\npaths retain case except for the existing GitHub behavior. A trailing slash\nnormalizes away. Only GitHub and Gitee normalize a terminal `.git` and match\nstandard HTTPS/443 with Git SSH/22. For other hosts, use the actual clone address:\ntransport, port, `.git` suffix, and remote-relative versus absolute paths must\nmatch. For example, `git@host:Team/repo` differs from\n`ssh://git@host/Team/repo`; `git@host:/Team/repo` matches the latter. SCP-style\npaths preserve literal percent escapes, while URI paths decode them. SSH host\naliases and forge-specific browse/clone prefixes are not guessed.\nGitLab/Gitea/Forgejo/Bitbucket web links are not implemented in this version;\nuse local-only until a tested link provider is available. Unknown web providers\nfail with a diagnostic rather than emitting a guessed link.\n\n## Hand-placed fallback\n\nUse only when no renderer can run. Start from `assets/template.html`, keep semantic CSS classes, preserve the inline SVG/accessibility structure, and run the delivery visual checklist. Never introduce inline literal colors that break dark/light parity."},"source-17a0819d7c6bcee3-s1":{"body":"来源：`archify/references/authoring-contract.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Authoring contract\n\nRead this reference only after the Fast authoring path calls for more detail. The schemas and examples remain authoritative.\n"},"source-17a0819d7c6bcee3-s2":{"body":"来源：`archify/references/authoring-contract.md:5-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Schema lookup\n\nRead both the mode schema and `schemas/common.schema.json`. The mode schemas use `$ref`, so the common file is where shared enums live.\n\n- `componentType`: `frontend`, `backend`, `database`, `cloud`, `security`, `messagebus`, `external`\n- `variant`: `default`, `emphasis`, `security`, `dashed`\n- Relationship IDs use the shared identifier pattern and must be unique in their collection.\n\nDo not invent fields. Use the nearest matching example for structure, then author fresh IDs, wording, facts, and layout.\n"},"source-17a0819d7c6bcee3-s3":{"body":"来源：`archify/references/authoring-contract.md:15-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语
