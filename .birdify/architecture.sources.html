仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Semantic Radar contract\n\n`semantic-radar.js` initializes `Archify.radar` once after Camera and before\nPresentation. It captures the diagram container and direct-child SVG, initial\nviewBox, map panel/surface/controls, navigation and optional Passport. It creates\none runtime map SVG outside the canonical diagram and schedules the initial\nnode build. Reopening rebuilds node rectangles without appending another map SVG.\nThe shared `viewerText` helper and the existing HTML/CSS stay in the shell.\n\nThe interface remains `open`, `close`, `toggle`, `sync`, `focus`, `isOpen`, and\n`count`. `isOpen()` reports requested intent, not panel visibility: unavailable\nspace can leave intent true while the panel is hidden and aria-expanded is false.\n`open()` returns true even in that state; `close(options)` returns false and\noptionally restores focus to the trigger. `toggle()` switches intent without\nrequesting surface focus. `sync()` immediately retries a requested hidden panel;\notherwise it coalesces work into one animation frame. It is not a stability Promise.\n\n`focus(id)` returns whether the main node was found and actions were issued, not\nwhether navigation finished. It preserves Guided Views expansion, Focus selection,\nCamera reveal, delayed page scrolling and main-node focus. `count()` reflects the\nlast build; it may be zero before the initial frame or with invalid geometry.\nFailed getBBox calls and non-positive boxes are skipped. Required DOM and input\nassumptions are unchanged.\n\n| State / dependency | Ownership and coordination |\n| --- | --- |\n| Open intent, panel hidden, trigger ARIA/labels/title and space feedback | Radar owns them. A hidden requested panel can recover on retry or reflow. Close clears intent and retries. |\n| Manual position and last placement; dock/side/compact/placement attributes; `--archify-radar-left/right/top` | Radar owns placement. Close clears current docking styles but retains position memory. Reopening or resizing can constrain it to current geometry. |\n| Panel drag and viewport drag | Titlebar input moves the panel; surface input calls Camera. Pointer matching, capture/release and cancellation retain their separate rules. `is-panning` is shared with Camera. |\n| Passport `data-radar-yielded` and saved `aria-hidden` | During compact expansion Radar can yield Passport space. Restoration reinstates the exact original attribute value, or removes it if originally absent. |\n| Map nodes, viewport rectangle, activity markers and status | Derived from main-node bounds, Camera logicalViewport, Focus and Story state. Authored SVG geometry, viewBox and semantic IDs are not rewritten. |\n| Sync frame, space retry and resize/scroll/ResizeObserver subscriptions | Page lifetime; no destroy method. Hidden-panel-only observer notifications are ignored to avoid a retry loop. |\n\nPlacement retains normal, compact and unavailable fallbacks. Navigation, Passport\nand legend are hard blockers; active nodes are soft blockers. Manual position\npriority, candidate scoring, clamping, gap and rounding remain private Radar\nimplementation. Cancelling titlebar drag restores the previous position intent\nand recomputes placement in the current layout; it need not restore identical\npixels after geometry changes. Capture-phase Escape cancels titlebar dragging\nbefore the global close shortcut. Surface pointercancel ends its drag without\nrestoring the previous camera state.\n\nCompact expansion may hide Passport temporarily. Failed expansion, returning to\ncompact, unavailable space and closing restore it through their existing paths.\nSpace retry permits four 60ms attempts per round; success and external reflow\ncan reset the count. Close clears that timer and both drag records, hides the\npanel and removes the shared panning class. It does not cancel the already queued\nsync frame (which checks hidden), the untracked delayed node-scroll callback, or\nuniversally remove every drag attribute. In particular, `data-dragging` is removed\nby the surface drag-end handler, not by the close/reset-docking path.\n\nCamera and Focus notify Radar to sync. Radar consumes Camera logicalViewport and\ncalls centerAt/reveal; opening clears Semantic Lens preview and closes that panel\nas before. Route, Semantic Lens, Guide and global keyboard handlers keep their\nexisting mutual-exclusion and focus rules. Reader's wide-diagram classification\nand Chrome's navigation reserve affect measured placement without transferring\nownership. Embed/print and narrow-screen presentation retain their existing CSS\nand caller rules, rather than a new universal Radar eligibility gate. Export\ncontinues cloning only the canonical diagram, excluding the runtime map SVG.\n"},"source-8424f5d65033b01c-s16":{"body":"来源：`viewer/README.md:843-904`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Motion Governor contract\n\n`motion-governor.js` initializes `Archify.motionGovernor` once after Export,\nbefore Source Evidence and Focus. It captures the initial trace capability,\nmain SVG, controls and reduced-motion query. Guided Views and Route initialize\nlater; their existence checks remain necessary. The final `syncVisibility()`,\n`publishOwner()`, `render()` calls keep their original order. CSS, controls,\ntranslation helpers and authored animation metadata stay in their existing sources.\n\nThe interface is `capable` plus `pause`, `resume`, `toggle`, `setMode`, `mode`,\n`claim`, `release`, `suspend`, `isPaused`, and `owner`. Capability is fixed from\nthe initial SVG `data-animation=\"trace\"`. Non-trace pages hide the control, clear\nthe existing root motion attributes, and return inert methods: false for pause/\nresume/toggle/release, zero for claim, still for modes, true for isPaused, an\nempty owner, and a suspension function returning false. That branch does not\ninstall the trace listeners or run its visibility initialization.\n\nFor trace pages, pause/resume/toggle return the reader's pause intent, while\nmode/isPaused report effective pause: reader intent OR reduced motion OR a\nnonempty suspension table. Thus resume can return false while mode remains still.\nsetMode treats only `still` as a pause request, returns effective mode and honors\n`persist:false`. The storage key remains `archify-motion`; user pause writes\n`still`, resume removes it, and storage errors are ignored. System suspension\ndoes not become a persisted user preference. Becoming live does not restart\nStory/Route playback or replay an already settled ambient pass.\n\nExplicit claims override derived owners. Without a claim, SVG attributes select\nStory playing/follow, chapter, route, lens, relationship, intent, focus, legend,\nthen empty, in that order. A semantic owner can coexist with live mode. Claiming\neven the same name clears the previous claim and invokes its cleanup before\npublishing a new token/owner. Cleanup errors are caught; synchronous reentry keeps\nthe existing call order without a new guard or queue. Releasing the current token\ndoes not run cleanup, advances the token and falls back to current SVG state.\nStale/repeated releases return false. Claims are not a stack of resumable owners.\n\n| State / dependency | Ownership and coordination |\n| --- | --- |\n| Reader pause, suspension table, previous effective-pause value | Governor owns these. Ordinary suspend keys count references; each returned release function succeeds once. Visibility directly sets/deletes the same table's `visibility` key, so a caller using that key does not have independent counting guarantees. |\n| Explicit/derived owner, token and cleanup callback | Governor owns arbitration. Guided handoff, chapter preview, Story and Route provide cleanup; their decorations and transaction state remain caller-owned. |\n| Root motion/owner/capable/document-hidden attributes and button hidden/disabled/ARIA/text/title | Governor writes them; CSS consumes them. System preference, suspension, reader pause and owner retain their existing label precedence. Only the system preference disables the button. |\n| Ambient started flag and pending element set | Governor starts at most one ambient pass and finishes it on the existing animation boundary or suppression paths. |\n| Button/media/visibility/mutation/animation subscriptions | Page lifetime, no destroy method. Owner observation is installed only when initially non-embed and supported; it watches the explicit SVG attribute list. |\n\nEntering effective pause pauses Story, settles handoff, and pauses Route Journey\nwith elapsed time preserved, using the existing reason priority and call order.\nRoute syncMotion retains its render-time notification. The previous-pause guard\ndoes not imply a universal once-only guarantee under synchronous caller reentry.\n\nAmbient starts from the initial edge/node animation targets. Animationend and\nanimationcancel remove event targets from the pending set; unrelated targets\nare ignored, and an empty set settles and detaches those listeners. There is no\nanimation-name filter, timeout or polling loop. Empty targets settle as empty;\npause, owner, embed, share playback or document-hidden suppress the pass through\nthe existing render paths. Settle reason can be overwritten by a later render;\nit is not immutable history. Runtime root-mode changes do not install additional\nlisteners or guarantee immediate reevaluation without an existing render trigger.\n\nThe Governor manages these Viewer signals, not every animation on the page.\nCamera retains its transactions and CSS transitions; Export retains its separate\nWebM canvas timeline. Authored geometry/IDs and canonical export cleanup remain\nunchanged by this source extraction.\n"},"source-8424f5d65033b01c-s17":{"body":"来源：`viewer/README.md:905-943`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Export cleanup contract\n\n`cleanExportClone(clone)` lives inside the Export closure. Its sole caller is\n`serializeSvg`: clone the live SVG, clean it, apply an explicitly requested\nRoute/Reach snapshot, then add dimensions, theme/font styles and serialize.\nIt mutates only the supplied SVG clone and returns the existing\n`canonicalStateClean` boolean. It neither reads live selection nor calls a\nViewer capability or changes the live DOM. No new `Archify` interface is exposed.\n\n| State owner | Clone treatment |\n| --- | --- |\n| Camera | Remove runtime transform, clipping and view scale. Preserve authored geometry and viewBox. |\n| Focus, relationship preview, reachability, Intent Trace | Remove selection/preview markers and runtime overlays; reset node `aria-pressed` using the existing rule. |\n| Guided Views and Story | Remove chapter/handoff/preview/beat markers, overlays and story step styles. |\n| Route Probe | Remove picking, result and journey markers/overlays and route step styles. |\n| Semantic Lens and legend preview | Remove filtering/preview decorations and runtime legend accessibility attributes. |\n| Source Evidence | Remove beacons/counts; restore recorded original labels. Missing or empty original labels remove `aria-label`, as before. |\n| Previous Route/Reach share decoration | Remove before applying the current export's explicit snapshot. |\n\nOriginal content, node/edge identity, geometry and authored animation metadata\nremain. Animation handling for share variants and recordings stays in Export.\nCleanup preserves the existing operation order, including overlay removal before\ndescendant cleanup. Missing optional decorations are harmless; repeated cleanup\nis idempotent. The function assumes an SVG clone supplied by Export, not null or\nthe live SVG. Restore records are runtime metadata, not a general undo history.\n\nThe boolean checks the existing known transient-state contract; it cannot detect\narbitrary future decorations. Keep the cleanup and its check together. Adding a\nnew runtime decoration still requires checking this contract: extraction isolates\nthat knowledge from serialization, but does not eliminate producer/cleanup\ncoordination. Do not broaden rules or rejection behavior during a pure extraction.\n\nRoute/Reach validation, finite-dimension checks, receipts, errors, menu behavior,\nrasterization, clipboard and recording remain owned by Export. Its existing\ncallers use the same paths and return fields. Tests exercise final browser exports;\nisolated clone tests supplement them for restoration and idempotence.\n\nFor required browser, output and package evidence, follow\n[Contributing](../CONTRIBUTING.md#local-setup-and-verification)."},"folder:reference:archify/renderers":{"body":"# archify/renderers\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:archify/renderers/workflow":{"body":"# archify/renderers/workflow\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-38d87c2793910c71":{"body":"# archify/renderers/workflow/README.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：archify/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Workflow Renderer\n\nRender `diagram_type: \"workflow\"` JSON files into the standard Archify HTML\ntemplate.\n\n```bash\nnode archify/renderers/workflow/render-workflow.mjs input.workflow.json output.html\n```\n\nThe renderer validates input against `archify/schemas/workflow.schema.json`\nwith the bundled standalone validator. No dependency installation is required.\n\nIf `output.html` is omitted, the renderer uses `meta.output` from the JSON file\nor falls back to `workflow.html` in the current working directory.\n\nAfter rendering, run the artifact checker:\n\n```bash\nnode archify/scripts/check-render-output.mjs output.html\n```\n\nIt catches final-SVG issues that are easiest to see in a browser: non-finite\nSVG values, accidental two-point diagonal arrows, and arrows crossing the\nlegend.\n\n## Input\n\nWorkflow JSON files must set:\n\n```json\n{\n  \"schema_version\": 2,\n  \"diagram_type\": \"workflow\",\n  \"meta\": {\n    \"title\": \"Agent Tool Call Workflow\"\n  },\n  \"lanes\": [],\n  \"phases\": [],\n  \"groups\": [],\n  \"mainPath\": [],\n  \"nodes\": [],\n  \"edges\": [],\n  \"cards\": []\n}\n```\n\nUse `schema_version: 2` for new workflows. Its readable layout compiler treats\nevery `col` as a logical rank in `0..5` and derives geometry from the measured\ndocument. `schema_version: 1` remains the fixed legacy contract for existing\nsources; valid v1 output is preserved byte-for-byte and never silently\nreinterpreted as v2.\n\nOmit `meta.viewBox` for the common v2 case so the compiler can use intrinsic\nmeasured bounds. In v1, the omitted width remains fixed at 720 and height is\nderived from lane count. A complete worked example lives at\n`archify/examples/agent-tool-call.workflow.json`; its `schema_version` selects\nthe applicable contract.\n\nThe schema lives at:\n\n```text\narchify/schemas/workflow.schema.json\n```\n\n## Migration and layout receipt\n\nMigrate an existing v1 source into a separate v2 file:\n\n```bash\nnode archify/scripts/archify.mjs migrate workflow old.json new.json --to-schema 2 --json\n```\n\nRunning the command again with its schema-v2 output as the new source is an\nidempotent verification pass: the destination bytes and geometry stay unchanged.\n\nThe command never overwrites the source by default. It maps absolute\n`via[*][0]`, `labelAt[0]`, and `channelX` values from legacy to solved rank\nspace, preserves y coordinates unless a reported vertical constraint needs\nauthor input, expands an explicit viewBox only for an unambiguous containment\nrepair, and writes the destination only after v2 compilation and artifact\nchecks pass. Ambiguous explicit pins fail without producing the destination.\n\nInspect the stable author-facing v2 plan with:\n\n```bash\nnode archify/scripts/archify.mjs validate workflow input.workflow.json --layout-json\n```\n\nThe receipt reports the selected contract, measured `viewBox` and\n`requiredViewBox`, solved columns, nodes, edges, labels, and causal diagnostics.\nIt deliberately omits solver iterations and candidate scores.\n\n## Legend\n\nThe default legend derives component kinds from `nodes[].type`. Supported\n`meta.legend.entries` keys, in stable order, are `frontend`, `backend`,\n`security`, `messagebus`, `database`, `cloud`, and `external`. Labels and\nvisibility may be overridden through the shared legend contract; only kinds\nbacked by rendered nodes receive Semantic Legend controls.\n\n## Layout contracts\n\n### Fixed v1\n\n| Constant | Value |\n|----------|-------|\n| viewBox | default `[720, auto]` — auto height = 52 + lanes×104 + (lanes−1)×20 + 124 |\n| Lane frame | x 40, width 640, height 104, gap 20; first lane top at y 52 |\n| Lane title strip | top 30px of each lane; node boxes must stay below it |\n| Column centers (`col` 0–5) | x = 88, 220, 300, 430, 500, 625 |\n| Phase headers | Optional `phases[]` render above the first lane, spanning `fromCol..toCol` |\n| Lane groups | Optional `groups[]` frame parallel work or branch work inside one lane |\n| Exception lanes | Set `lane.variant: \"exception\"` for retry, denial, fallback, or failure paths |\n| Main path lint | Optional `mainPath[]` checks that happy-path steps have matching edges and do not move backward |\n| Default node | 92×52 (height 68 when `tag` is set) |\n| Node spacing | ≥8px between nodes in the same lane |\n| Edge length | straight segments must span ≥28px |\n| Legend row | y = lane bottom + 44; viewBox height must be ≥ legend y + 18 |\n\nColumn-center gaps are 132 / 80 / 130 / 70 / 125 px: columns 1↔2 (80px) and\n3↔4 (70px) cannot both hold default-width 92px nodes in the same lane. Such an\ninvalid v1 source receives one causal `workflow/column-capacity` diagnostic and\na verified migration-to-v2 repair; v1 never falls through to adaptive layout.\n\n### Readable v2\n\n| Invariant | Contract |\n|----------|----------|\n| Logical columns | `col` is an integer in `0..5`; pixel centers are measured output |\n| Adjacent-rank baseline | 120px center distance before document-specific constraints |\n| Same-lane node clearance | ≥8px when vertical node intervals overlap |\n| Facing direct edge | clear gap ≥`max(28px, measured label mask width + 8px)` |\n| Automatic route rhythm | direct segment ≥28px; endpoint stub ≥8px; interior turn segment ≥16px |\n| Implicit viewBox | intrinsic content bounds plus contract padding |\n| Explicit viewBox | containment capacity; too-small input reports exact `requiredViewBox` and contributors |\n\nThe compiler applies constraints only to actual related or overlapping\nsame-lane nodes, so a wide node in an unrelated lane does not expand every\nrank. Legacy centers are a soft preference after correctness constraints, not\na geometry promise. Phase and group frames derive from the solved rank bands.\nAutomatic routes are normalized once and the same final scene drives\nvalidation and SVG serialization. Long automatic labels compare direct-gutter\ngrowth with a legal channel instead of widening every downstream rank. Measured\nmulti-row legends participate in intrinsic height and explicit viewBox\ncapacity.\n\nAuthored `via`, `labelAt`, `channelX`, and `channelY` are absolute hard pins in\nv2; an infeasible pin returns `workflow/explicit-pin-conflict` rather than being\nsilently moved. `fromSide` and `toSide` remain direction constraints. A route\npreset restricts the automatic candidate family but is not itself an absolute\ncoordinate pin. When either endpoint side is omitted, the v2 compiler chooses\na feasible side; an authored side restricts that endpoint to the named port.\n\n## Design Rules\n\n- Use lanes for ownership or runtime boundaries.\n- Use phase headers for high-level story beats such as Intake, Plan, Execute, and Report.\n- Use groups for parallel checks, branch handling, or bounded work within a lane; every group must contain at least one node.\n- Use `lane.variant: \"exception\"` for human wait, denial, retry, fallback, and failure lanes instead of mixing those paths into the happy path.\n- Set `mainPath` when the diagram has a clear happy path; the renderer validates that consecutive ids have matching edges and move left-to-right.\n- Place nodes with lane IDs and `col` indexes in `0..5`, not raw SVG coordinates.\n- Preserve semantic edge labels. Readable v2 allocates measured label clearance;\n  when a label does not fit, repair the reported capacity or route constraint\n  instead of deleting meaning.\n- Use labels for decisions, approvals, protocols, async traces, return paths,\n  and any other relationship meaning not fully implied by its endpoints.\n- Prefer route presets — `drop` (bend between lanes; `bias` 0–1 picks where),\n  `outside-right`, `return-left`, `bottom-channel`, and `up-channel` — before\n  using raw `via` points. `straight` and the default `auto` cover the rest.\n- Keep workflow examples compact enough to render well in narrow chat/browser\n  previews.\n\n### Optional semantic checks\n\nLayout validation cannot infer domain truth from labels or cards. When source\nevidence establishes roots, terminals, mandatory direct relationships, or\nmandatory directed reachability, encode those facts in `semanticChecks`:\n\n```json\n\"semanticChecks\": {\n  \"allowedRoots\": [\"request\", \"resource_catalog\"],\n  \"allowedTerminals\": [\"reply\", \"audit_log\"],\n  \"requiredEdges\": [\n    { \"from\": \"dispatch\", \"to\": \"dispatch_ledger\" }\n  ],\n  \"requiredPaths\": [\n    { \"from\": \"event_ledger\", \"to\": \"runtime_host\" }\n  ]\n}\n```\n\nWhen `allowedRoots` or `allowedTerminals` is present, it is the complete allow\nlist for zero-incoming or zero-outgoing nodes respectively. `requiredEdges`\nrequires one exact authored direction; `requiredPaths` permits intermediate\nnodes but follows authored edge direction. These checks run before layout, do\nnot alter SVG or receipt bytes, and must not be weakened merely to resolve a\nroute or composition diagnostic. Omit fields whose domain facts are unknown.\n\nSchema violations exit non-zero with path-prefixed messages annotated with the\nelement's id or label. The renderer additionally fails when it can detect\nlayout problems, including node overlap, nodes outside their lanes, invalid\nphase/group column ranges, empty groups, broken `mainPath` steps, unknown edge\ntargets, labels colliding with nodes or other labels, labels wider than their\nnode, legends outside the viewBox, or straight arrows that are too short to\nread cleanly. The shared Clean Flow Gate also rejects edges crossing unrelated\nnodes with 2px clearance; lanes, phases, and groups remain intentional\npass-through containers. Text width is estimated CJK-aware: fullwidth glyphs\ncount as two units.\n\nDiagnostics are causal: a rank-capacity failure suppresses derivative short\nedge, endpoint-direction, and label-overlap findings. Every\n`supportedFixes[]` entry is verified by replanning the proposed edit, and a\ndiagnostic never proposes removing a semantic label when label presence does\nnot cause the failed invariant.\n\nSet `meta.quality_profile` to `showcase` for polished delivery. Unrelated proper\nX crossings then fail with `composition/proper-crossing`; default `standard`\nkeeps them as artifact-receipt warnings. Collinear lane corridors are outside\nthe proper-X rule, but a separate gate warns in `standard` and fails in\n`showcase` when unrelated edges overlap for at least 8px. Shared semantic\nendpoints, point touches, and shorter overlaps remain valid. Showcase also\nrejects any route segment below 8px and any interior turn segment below 16px;\nordinary 8–15px endpoint stubs remain valid for fixed lane gaps."},"source-38d87c2793910c71-s1":{"body":"来源：`archify/renderers/workflow/README.md:1-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Workflow Renderer\n\nRender `diagram_type: \"workflow\"` JSON files into the standard Archify HTML\ntemplate.\n\n```bash\nnode archify/renderers/workflow/render-workflow.mjs input.workflow.json output.html\n```\n\nThe renderer validates input against `archify/schemas/workflow.schema.json`\nwith the bundled standalone validator. No dependency installation is required.\n\nIf `output.html` is omitted, the renderer uses `meta.output` from the JSON file\nor falls back to `workflow.html` in the current working directory.\n\nAfter rendering, run the artifact checker:\n\n```bash\nnode archify/scripts/check-render-output.mjs output.html\n```\n\nIt catches final-SVG issues that are easiest to see in a browser: non-finite\nSVG values, accidental two-point diagonal arrows, and arrows crossing the\nlegend.\n"},"source-38d87c2793910c71-s2":{"body":"来源：`archify/renderers/workflow/README.md:26-64`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Input\n\nWorkflow JSON files must set:\n\n```json\n{\n  \"schema_version\": 2,\n  \"diagram_type\": \"workflow\",\n  \"meta\": {\n    \"title\": \"Agent Tool Call Workflow\"\n  },\n  \"lanes\": [],\n  \"phases\": [],\n  \"groups\": [],\n  \"mainPath\": [],\n  \"nodes\": [],\n  \"edges\": [],\n  \"cards\": []\n}\n```\n\nUse `schema_version: 2` for new workflows. Its readable layout compiler treats\nevery `col` as a logical rank in `0..5` and derives geometry from the measured\ndocument. `schema_version: 1` remains the fixed legacy contract for existing\nsources; valid v1 output is preserved byte-for-byte and never silently\nreinterpreted as v2.\n\nOmit `meta.viewBox` for the common v2 case so the compiler can use intrinsic\nmeasured bounds. In v1, the omitted width remains fixed at 720 and height is\nderived from lane count. A complete worked example lives at\n`archify/examples/agent-tool-call.workflow.json`; its `schema_version` selects\nthe applicable contract.\n\nThe schema lives at:\n\n```text\narchify/schemas/workflow.schema.json\n```\n"},"source-38d87c2793910c71-s3":{"body":"来源：`archify/renderers/workflow/README.md:65-92`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Migration and layout receipt\n\nMigrate an existing v1 source into a separate v2 file:\n\n```bash\nnode archify/scripts/archify.mjs migrate workflow old.json new.json --to-schema 2 --json\n```\n\nRunning the command again with its schema-v2 output as the new source is an\nidempotent verification pass: the destination bytes and geometry stay unchanged.\n\nThe command never overwrites the source by default. It maps absolute\n`via[*][0]`, `labelAt[0]`, and `channelX` values from legacy to solved rank\nspace, preserves y coordinates unless a reported vertical constraint needs\nauthor input, expands an explicit viewBox only for an unambiguous containment\nrepair, and writes the destination only after v2 compilation and artifact\nchecks pass. Ambiguous explicit pins fail without producing the destination.\n\nInspect the stable author-facing v2 plan with:\n\n```bash\nnode archify/scripts/archify.mjs validate workflow input.workflow.json --layout-json\n```\n\nThe receipt reports the selected contract, measured `viewBox` and\n`requiredViewBox`, solved columns, nodes, edges, labels, and causal diagnostics.\nIt deliberately omits solver iterations and candidate scores.\n"},"source-38d87c2793910c71-s4":{"body":"来源：`archify/renderers/workflow/README.md:93-100`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Legend\n\nThe default legend derives component kinds from `nodes[].type`. Supported\n`meta.legend.entries` keys, in stable order, are `frontend`, `backend`,\n`security`, `messagebus`, `database`, `cloud`, and `external`. Labels and\nvisibility may be overridden through the shared legend contract; only kinds\nbacked by rendered nodes receive Semantic Legend controls.\n"},"source-38d87c2793910c71-s5":{"body":"来源：`archify/renderers/workflow/README.md:101-102`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Layout contracts\n"},"source-38d87c2793910c71-s6":{"body":"来源：`archify/renderers/workflow/README.md:103-124`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Fixed v1\n\n| Constant | Value |\n|----------|-------|\n| viewBox | default `[720, auto]` — auto height = 52 + lanes×104 + (lanes−1)×20 + 124 |\n| Lane frame | x 40, width 640, height 104, gap 20; first lane top at y 52 |\n| Lane title strip | top 30px of each lane; node boxes must stay below it |\n| Column centers (`col` 0–5) | x = 88, 220, 300, 430, 500, 625 |\n| Phase headers | Optional `phases[]` render above the first lane, spanning `fromCol..toCol` |\n| Lane groups | Optional `groups[]` frame parallel work or branch work inside one lane |\n| Exception lanes | Set `lane.variant: \"exception\"` for retry, denial, fallback, or failure paths |\n| Main path lint | Optional `mainPath[]` checks that happy-path steps have matching edges and do not move backward |\n| Default node | 92×52 (height 68 when `tag` is set) |\n| Node spacing | ≥8px between nodes in the same lane |\n| Edge length | straight segments must span ≥28px |\n| Legend row | y = lane bottom + 44; viewBox height must be ≥ legend y + 18 |\n\nColumn-center gaps are 132 / 80 / 130 / 70 / 125 px: columns 1↔2 (80px) and\n3↔4 (70px) cannot both hold default-width 92px nodes in the same lane. Such an\ninvalid v1 source receives one causal `workflow/column-capacity` diagnostic and\na verified migration-to-v2 repair; v1 never falls through to adaptive layout.\n"},"source-38d87c2793910c71-s7":{"body":"来源：`archify/renderers/workflow/README.md:125-153`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Readable v2\n\n| Invariant | Contract |\n|----------|----------|\n| Logical columns | `col` is an integer in `0..5`; pixel centers are measured output |\n| Adjacent-rank baseline | 120px center distance before document-specific constraints |\n| Same-lane node clearance | ≥8px when vertical node intervals overlap |\n| Facing direct edge | clear gap ≥`max(28px, measured label mask width + 8px)` |\n| Automatic route rhythm | direct segment ≥28px; endpoint stub ≥8px; interior turn segment ≥16px |\n| Implicit viewBox | intrinsic content bounds plus contract padding |\n| Explicit viewBox | containment capacity; too-small input reports exact `requiredViewBox` and contributors |\n\nThe compiler applies constraints only to actual related or overlapping\nsame-lane nodes, so a wide node in an unrelated lane does not expand every\nrank. Legacy centers are a soft preference after correctness constraints, not\na geometry promise. Phase and group frames derive from the solved rank bands.\nAutomatic routes are normalized once and the same final scene drives\nvalidation and SVG serialization. Long automatic labels compare direct-gutter\ngrowth with a legal channel instead of widening every downstream rank. Measured\nmulti-row legends participate in intrinsic height and explicit viewBox\ncapacity.\n\nAuthored `via`, `labelAt`, `channelX`, and `channelY` are absolute hard pins in\nv2; an infeasible pin returns `workflow/explicit-pin-conflict` rather than being\nsilently moved. `fromSide` and `toSide` remain direction constraints. A route\npreset restricts the automatic candidate family but is not itself an absolute\ncoordinate pin. When either endpoint side is omitted, the v2 compiler chooses\na feasible side; an authored side restricts that endpoint to the named port.\n"},"source-38d87c2793910c71-s8":{"body":"来源：`archify/renderers/workflow/README.md:154-172`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Design Rules\n\n- Use lanes for ownership or runtime boundaries.\n- Use phase headers for high-level story beats such as Intake, Plan, Execute, and Report.\n- Use groups for parallel checks, branch handling, or bounded work within a lane; every group must contain at least one node.\n- Use `lane.variant: \"exception\"` for human wait, denial, retry, fallback, and failure lanes instead of mixing those paths into the happy path.\n- Set `mainPath` when the diagram has a clear happy path; the renderer validates that consecutive ids have matching edges and move left-to-right.\n- Place nodes with lane IDs and `col` indexes in `0..5`, not raw SVG coordinates.\n- Preserve semantic edge labels. Readable v2 allocates measured label clearance;\n  when a label does not fit, repair the reported capacity or route constraint\n  instead of deleting meaning.\n- Use labels for decisions, approvals, protocols, async traces, return paths,\n  and any other relationship meaning not fully implied by its endpoints.\n- Prefer route presets — `drop` (bend between lanes; `bias` 0–1 picks where),\n  `outside-right`, `return-left`, `bottom-channel`, and `up-channel` — before\n  using raw `via` points. `straight` and the default `auto` cover the rest.\n- Keep workflow examples compact enough to render well in narrow chat/browser\n  previews.\n"},"source-38d87c2793910c71-s9":{"body":"来源：`archify/renderers/workflow/README.md:173-223`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Optional semantic checks\n\nLayout validation cannot infer domain truth from labels or cards. When source\nevidence establishes roots, terminals, mandatory direct rel def\"\n     }\n   }\n   ```\n\n4. If there is no match and no user-provided URL, omit `brand`. Do not invent a\n   URL or silently assign a visually similar company.\n\nKnown-brand URLs resolve to the bundled vector instead of using the network.\nUnknown URL capture accepts only bounded raster image formats, blocks\ncredentials, nonstandard public ports, and private or link-local destinations,\nuses bounded concurrency and one total deadline, and returns the captured\ncontent digest. Later render and validate operations require that exact digest;\nblocked, unavailable, changed, oversized, or unsafe content fails closed instead\nof silently changing the artifact.\n\nThe final artifact never fetches a brand asset when opened. Preset vectors and\ndigest-verified captured site icons remain embedded in SVG, PNG, WebP, JPEG,\nShare Card, and WebM exports.\n\nUse `node scripts/archify.mjs brands --json` to inspect all canonical IDs, aliases,\ncategories, domains, and provenance. Current categories cover AI, cloud,\nengineering, data, collaboration, business systems, channels, languages, and\nframeworks."},"source-ceb415e513d93a91-s1":{"body":"来源：`archify/references/brand-marks.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Brand marks\n\nUse a brand mark only when a real product, provider, model family, channel, or\nservice identity helps the reader. Semantic `type` still explains what the node\ndoes; `brand` explains whose product it is.\n"},"source-ceb415e513d93a91-s2":{"body":"来源：`archify/references/brand-marks.md:7-65`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Agent decision path\n\n1. Search the built-in catalogue when the request names a recognizable brand:\n\n   ```bash\n   node scripts/archify.mjs brands \"Claude\" --json\n   ```\n\n2. Put the returned canonical ID in the node, participant, or state:\n\n   ```json\n   {\n     \"id\": \"planner\",\n     \"type\": \"backend\",\n     \"label\": \"Claude\",\n     \"brand\": \"claude\"\n   }\n   ```\n\n3. If there is no catalogue match and the user supplied the official website,\n   capture its icon explicitly:\n\n   ```bash\n   node scripts/archify.mjs brands capture \"https://partner.example.com\" --json\n   ```\n\n   Put the command's digest-pinned `brand` value in the authored node:\n\n   ```json\n   {\n     \"id\": \"partner\",\n     \"type\": \"external\",\n     \"label\": \"Partner portal\",\n     \"brand\": {\n       \"url\": \"https://partner.example.com\",\n       \"sha256\": \"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\"\n     }\n   }\n   ```\n\n4. If there is no match and no user-provided URL, omit `brand`. Do not invent a\n   URL or silently assign a visually similar company.\n\nKnown-brand URLs resolve to the bundled vector instead of using the network.\nUnknown URL capture accepts only bounded raster image formats, blocks\ncredentials, nonstandard public ports, and private or link-local destinations,\nuses bounded concurrency and one total deadline, and returns the captured\ncontent digest. Later render and validate operations require that exact digest;\nblocked, unavailable, changed, oversized, or unsafe content fails closed instead\nof silently changing the artifact.\n\nThe final artifact never fetches a brand asset when opened. Preset vectors and\ndigest-verified captured site icons remain embedded in SVG, PNG, WebP, JPEG,\nShare Card, and WebM exports.\n\nUse `node scripts/archify.mjs brands --json` to inspect all canonical IDs, aliases,\ncategories, domains, and provenance. Current categories cover AI, cloud,\nengineering, data, collaboration, business systems, channels, languages, and\nframeworks."},"source-6be3b44098be3230":{"body":"# archify/references/viewer-runtime.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：archify/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Viewer Runtime reference\n\nRead this only when the user asks for a reader-facing capability. Ordinary generation does not require implementing or re-documenting these features; they are already in the generated HTML.\n\n## Exploration\n\n- Diagram Guide lists current actions and shortcuts.\n- Reading Depth starts at READ at the default 100% scale, reveals FULL detail at 175%, and falls back to MAP only below 100%. Focus, story, route, and semantic interactions reveal their exact facts at any scale.\n- Semantic Lens summarizes selected node/relationship kinds without changing authored geometry.\n- Intent Trace previews a fine-pointer or keyboard target before committed focus.\n- Node Finder searches labels and stable IDs.\n- Semantic Passport opens on focus, shows authored upstream/downstream facts, supports a copyable deep link, has an explicit close action, closes on true outside activation and Escape, and never enters canonical export.\n- Semantic Radar mirrors the visible viewport and authored graph without becoming a second source of truth.\n- Direct Relationship Pin makes a unique compiled relationship operable while preserving the authored line and stable relationship identity. It must fail closed on conflicting source/target/label/ID metadata.\n- Route Probe resolves exactly two endpoints over authored directed relationships. It never infers a route from geometry.\n\n## Guided views and story\n\n`meta.views` may define at most five curated chapters using stable node IDs. The Named Chapter Rail, Chapter Delta Preview, Story Beat Navigator, Story Follow Camera, Story Director Strip, Story Horizon, and Shareable Story Moment links all derive from that one authored array; none owns parallel topology or layout.\n\nStory transitions classify only the exact relationship between adjacent authored stops: forward, reverse, multiple, or grouped/no direct link. Never infer a transitive edge, verb, causality, or runtime behavior from proximity, kinds, or story order. Playback is reader-started, bounded, stale-safe, and motion-governed.\n\n## Motion and presentation\n\n`meta.animation: \"trace\"` enables a finite reader-controlled Live/Still trace. Static is the default. Still, reduced motion, page hiding, print, and canonical export preserve complete static meaning. Presentation Stage changes viewer chrome and framing, never authored geometry. This is not a mobile product feature; narrow layouts get containment only.\n\n## Canonical exports\n\nThe export menu can copy/download full-diagram PNG, download JPEG/WebP, download a dual-theme SVG, and record a trace-enabled WebM. Viewer state—Guide, Lens, finder, focus, route, story, camera, radar, presentation, motion ownership, and temporary overlays—must be removed from canonical export.\n\n### Share Card\n\nThe optional 1200×630 Share Card PNG is for README, release, social, or launch previews. It uses the current theme and visual preset, contains the complete canonical diagram without cropping, and never claims validation. Copy Share Card reuses the same canonical PNG when clipboard image writes are supported.\n\n### Route Share Card\n\nAfter a real directed Route Probe resolves, the reader may use **Export → Route Share Card**. It reuses the exact ordered route snapshot and the shared Share Card seam: `format=share-card`, `variant=route`. The isolated clone may use only static `data-share-route-*` decoration. It is download-only, fails closed for stale/unreachable/conflicting routes, and never becomes the canonical artifact.\n\n### Reach Share Card\n\nAfter a non-empty authored reachability query, the reader may use **Export → Reach Share Card**. It consumes the already resolved upstream/downstream node and edge set without rerunning traversal: `format=share-card`, `variant=reach`. The isolated clone may use only static `data-share-reach-*` decoration. It is download-only. Call it authored reachability—not impact, blast radius, breakage, or runtime causality.\n\n## Truth boundary\n\nViewer exports are communication assets. They do not replace the checked HTML, the deterministic delivery receipt, or a real visual review. Do not add a hosted service, storage surface, dependency, schema branch, or mobile product surface for these viewer-only capabilities."},"source-6be3b44098be3230-s1":{"body":"来源：`archify/references/viewer-runtime.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Viewer Runtime reference\n\nRead this only when the user asks for a reader-facing capability. Ordinary generation does not require implementing or re-documenting these features; they are already in the generated HTML.\n"},"source-6be3b44098be3230-s2":{"body":"来源：`archify/references/viewer-runtime.md:5-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Exploration\n\n- Diagram Guide lists current actions and shortcuts.\n- Reading Depth starts at READ at the default 100% scale, reveals FULL detail at 175%, and falls back to MAP only below 100%. Focus, story, route, and semantic interactions reveal their exact facts at any scale.\n- Semantic Lens summarizes selected node/relationship kinds without changing authored geometry.\n- Intent Trace previews a fine-pointer or keyboard target before committed focus.\n- Node Finder searches labels and stable IDs.\n- Semantic Passport opens on focus, shows authored upstream/downstream facts, supports a copyable deep link, has an explicit close action, closes on true outside activation and Escape, and never enters canonical export.\n- Semantic Radar mirrors the visible viewport and authored graph without becoming a second source of truth.\n- Direct Relationship Pin makes a unique compiled relationship operable while preserving the authored line and stable relationship identity. It must fail closed on conflictin ody":"来源：`archify/references/viewer-runtime.md:43-45`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Truth boundary\n\nViewer exports are communication assets. They do not replace the checked HTML, the deterministic delivery receipt, or a real visual review. Do not add a hosted service, storage surface, dependency, schema branch, or mobile product surface for these viewer-only capabilities."},"rule-no-secrets":{"body":"# 样本不得含秘密\n\n秘密、令牌、私有仓库内容和个人数据不能进入这些材料。\n\n## 适用条件\n\n提交夹具、日志、截图、产物或包测试时\n\n适用性：applicable\n\n## 原文\n\nDo not include secrets, access tokens, credentials, private repository content, personal data, or customer data in fixtures, logs, screenshots, artifacts, or package tests.\n\n## 验证计划\n\n检查待提交内容是否包含凭据或私有数据。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-schema-v1":{"body":"# 既有 schema v1 保持有效\n\n已有 schema v1 文档继续有效，除非经过审查的变更明确给出破坏性规则和迁移路径。\n\n## 适用条件\n\n修改图表契约时\n\n适用性：applicable\n\n## 原文\n\n- Existing schema-v1 typed JSON remains valid unless a reviewed change explicitly introduces a breaking rule and migration path.\n\n## 验证计划\n\n用现有 v1 样例跑校验，并核对是否写明迁移。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-immutable-versions":{"body":"# 已发布版本不可变\n\n功能 PR 不改版本、标签或分发身份，除非本次范围明确包含发布。\n\n## 适用条件\n\n普通功能改动时\n\n适用性：applicable\n\n## 原文\n\nTreat published versions as immutable. Ordinary feature PRs do not change versions, tags, or distribution identities unless release work is explicitly in scope.\n\n## 验证计划\n\n核对 package 版本、标签和发布身份是否被无关改动。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-static-default":{"body":"# 默认输出静态图\n\n只有用户要求演示或展示时才打开运动。\n\n## 适用条件\n\n生成图表时\n\n适用性：conditional\n\n## 原文\n\nCreate a self-contained, interactive HTML diagram from a small typed JSON specification. Static output is the default; enable motion only when the user asks for a demo or presentation.\n\n## 验证计划\n\n检查候选是否在未要求时省略 animation。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-artifact-first":{"body":"# 先写候选再看渲染器\n\n下一步应写出候选，不要先读渲染器内部或在正文里规划精确坐标。\n\n## 适用条件\n\n普通图表生成时\n\n适用性：conditional\n\n## 原文\n\n3. Artifact first: the next tool action must write the candidate. Write the candidate before inspecting renderer internals. Do not plan exact coordinates in prose. Start with one clear main path, short side branches, sparse labels, and at most 12 primary nodes. Set `meta.quality_profile` to `\"showcase\"` unless the user explicitly requests a dense `standard` map. Start with automatic routes and labels. Do not add `via`, `channelX`, `channelY`, or `labelAt` before a diagnostic calls for one; apply at most one diagnosed geometry control per repair.\n\n## 验证计划\n\n核对创作顺序：候选文件先于渲染器阅读。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-nonzero-failure":{"body":"# 非零退出不是成功\n\ndeliver 非零退出不能说成成功。失败会保留上一份输出，不能对那条路径做 visual-check。\n\n## 适用条件\n\n交付 HTML 时\n\n适用性：applicable\n\n## 原文\n\n   A non-zero exit can never be described as success. A failed delivery preserves any previous output, so do not run `visual-check` on that path: it would inspect the stale last-good artifact, not the failed candidate. If validation fails, change only the diagnosed `subject`, verify `evidence`, choose from `supportedFixes`, and rerun. Continue focused correction while the objective error count reaches a new minimum. If two consecutive rounds do not improve that best count, stop and report the unresolved diagnostics truthfully.\n\n## 验证计划\n\n记录 deliver 退出码；失败时不要把旧产物当成新候选。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-no-invented-fields":{"body":"# 不得发明字段\n\n用最近的样例确定结构，然后写新的 ID、措辞、事实和布局。\n\n## 适用条件\n\n编写 typed JSON 时\n\n适用性：applicable\n\n## 原文\n\nDo not invent fields. Use the nearest matching example for structure, then author fresh IDs, wording, facts, and layout.\n\n## 验证计划\n\n对照模式 schema 校验候选，确认没有未知字段。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-preserve-artifact":{"body":"# 失败保留上一份可信产物\n\n渲染、检查或回执失败时退出非零，并保留上一份可信产物，不打开文件。\n\n## 适用条件\n\ndeliver 未通过时\n\n适用性：applicable\n\n## 原文\n\nDeliver reads the specification once, writes those exact bytes to a private same-directory candidate snapshot, renders that snapshot, runs the complete artifact checker, and only replaces the target after all artifact checks pass. The JSON receipt includes SHA-256 and byte counts for both `specification` and `artifact`. Renderer, checker, receipt, or commit failure exits non-zero, removes private state, preserves the previous trusted artifact, and never invokes an opener.\n\n## 验证计划\n\n让 deliver 失败，确认旧 HTML 仍在且没有被打开。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-policy-no-screenshots":{"body":"# 纯政策改动不做版面截图\n\n这类改动做一致性检查，不要求布局截图。\n\n## 适用条件\n\n只改仓库政策文本时\n\n适用性：conditional\n\n## 原文\n\nChoose checks that resolve the important uncertainties, including relevant historical failures and authored constraints. Broaden the investigation when findings or coverage gaps warrant it. Repository-only policy changes need consistency checks, not layout screenshots.\n\n## 验证计划\n\n按改动面核对文档与模板是否一致。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-private-report":{"body":"# 漏洞私下报告\n\n先私下报告，让维护者调查并协调修复，再公开披露。\n\n## 适用条件\n\n发现疑似安全漏洞时\n\n适用性：applicable\n\n## 原文\n\nArchify welcomes responsible security reports. Please report suspected\nvulnerabilities privately so maintainers can investigate and coordinate\nremediation before public disclosure.\n\n## 验证计划\n\n确认报告走私下渠道，公开材料不含利用细节。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-separate-visual-claims":{"body":"# 自动检查与观感分开写\n\n浏览器或自动化结果与观感审查是两项声明，不能混写成一次通过。\n\n## 适用条件\n\n提交可见界面改动时\n\n适用性：conditional\n\n## 原文\n\nReport automated or browser evidence separately from perceptual review.\n\n## 验证计划\n\nPR 里分别填写自动化检查和观感审查。\n\n尚未验证实现；规则适用性不等于合规结果。"}}}</script>
