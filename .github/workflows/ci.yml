name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Golden-file + schema tests
        run: pnpm test

  webm-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision a known Chrome runtime
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install the WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Decode a real motion export and reject static frames
        run: pnpm run test:webm
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Verify packaged examples and Reader Layout boundaries in a real browser
        run: node --test test/desktop-reader-browser.test.mjs test/reader-layout-browser.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify SVG export cleanup and live state isolation
        run: node --test test/export-cleanup-browser.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify offline fonts and independent SVG/raster exports
        run: node --test test/offline-font-browser.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify all five diagram modes localize Viewer interactions
        run: node --test test/i18n.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify Semantic Radar collision and drag behavior
        run: node --test test/semantic-radar.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify Viewer chrome, camera, motion and input interactions
        run: node --test --test-concurrency=2 test/viewer-chrome-layout.test.mjs test/viewer-camera-browser.test.mjs test/motion-governor-browser.test.mjs test/finder-browser.test.mjs test/intent-trace-browser.test.mjs test/semantic-lens-browser.test.mjs test/route-probe-browser.test.mjs test/guided-views-browser.test.mjs test/focus-browser.test.mjs test/export-browser.test.mjs test/viewer-identifiers-browser.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'

  package-smoke:
    name: package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # npx skills installs this tracked Skill tree. Smoke that tree, not a Release zip.
      - name: Stage the skill and smoke it
        shell: bash
        run: |
          set -euo pipefail
          package_root="${RUNNER_TEMP}/archify-package/archify"
          rm -rf "${RUNNER_TEMP}/archify-package"
          pnpm exec archify-dev package stage --dest "$package_root"
          pnpm exec archify-dev package smoke "$package_root"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, webm-artifact, package-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Reject an obsolete deployment run
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete Pages deployment for ${GITHUB_SHA}; main is ${current_main}"
          fi
      - uses: pnpm/action-setup@v5
        if: steps.deployment-head.outputs.current == 'true'
      - uses: actions/setup-node@v5
        if: steps.deployment-head.outputs.current == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        if: steps.deployment-head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the public site
        if: steps.deployment-head.outputs.current == 'true'
        env:
          GITHUB_PAGES: 'true'
        run: pnpm --filter archify-site build
      - name: Configure GitHub Pages
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/configure-pages@v6
      - name: Upload the public site
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist
      - name: Deploy the public site
        if: steps.deployment-head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
